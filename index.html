    +'<input type="file" accept="image/*" capture="environment" id="efile" hidden></div>'
    +'<div class="field"><label id="splitlbl">'+(etype==='income'?'Kimlarga tegishli':'Qanday bo‘linadi')+'</label>'
    +'<div class="seg five" id="mseg">'
    +'<button type="button" data-m="equal" aria-pressed="'+(mode==='equal')+'">Teng</button>'
    +'<button type="button" data-m="bill" aria-pressed="'+(mode==='bill')+'">Chek</button>'
    +'<button type="button" data-m="exact" aria-pressed="'+(mode==='exact')+'">Aniq</button>'
    +'<button type="button" data-m="shares" aria-pressed="'+(mode==='shares')+'">Ulush</button>'
    +'<button type="button" data-m="pct" aria-pressed="'+(mode==='pct')+'">Foiz</button>'
    +'</div></div>'
    +'<div id="splitbox">'+buildSplitBody(mode,g,parseAmount(e.amount||0),prevSplitMap(e.splits))+'</div>'
    +'<button class="btn btn-primary btn-block" type="submit">'+(isEdit?'Saqlash':'Qo‘shish')+'</button>'
    +(isEdit?'<button class="btn btn-danger btn-block" type="button" data-act="del-expense" data-gid="'+g.id+'" data-id="'+e.id+'">O‘chirish</button>':'')
    +'</form>';

  openModal(isEdit?'Amaliyotni tahrirlash':'Yangi amaliyot', body, {
    onMount:function(root){
      var box=root.querySelector('#splitbox');
      var amtInput=root.querySelector('#eamt');
      function amount(){ return parseAmount(amtInput.value); }
      /* Summani foydalanuvchi o‘zi yozmagan bo‘lsa, «Teng» rejimida qo‘lda
         yozilgan shaxsiy summalar jamlanib SUMMA maydoniga tushadi —
         chek bo‘yicha har kimnikini yozib chiqsa, jami o‘zi chiqadi. */
      var amtTouched = !!(e && e.amount > 0);
      function setAmt(v){ amtInput.value = v > 0 ? String(v) : ''; }

      root.querySelectorAll('#etseg button').forEach(function(b){
        b.addEventListener('click',function(){
          etype=b.dataset.et;
          root.querySelectorAll('#etseg button').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.et===etype); });
          root.querySelector('#paidlbl').textContent = etype==='income'?'Kim qabul qildi':'Kim to‘ladi';
          root.querySelector('#splitlbl').textContent = etype==='income'?'Kimlarga tegishli':'Qanday bo‘linadi';
          root.querySelector('#ecat').innerHTML = catOptions(null,etype);
          root.querySelector('#rcfield').hidden = (etype==='income');
        });
      });
      root._getEType=function(){ return etype; };

      // receipt
      var receipt = e.receipt || null;
      var rzone = root.querySelector('#rzone');
      var efile = root.querySelector('#efile');
      function paintZone(){
        rzone.innerHTML = receiptZone(receipt);
        var pick=rzone.querySelector('[data-act="rc-pick"]');
        var rem=rzone.querySelector('[data-act="rc-remove"]');
        var v=rzone.querySelector('[data-act="rc-view"]');
        if(pick) pick.addEventListener('click',function(){ efile.click(); });
        if(rem) rem.addEventListener('click',function(){ receipt=null; paintZone(); });
        if(v) v.addEventListener('click',function(){ openImage(receipt); });
      }
      efile.addEventListener('change',function(){
        var f=efile.files && efile.files[0]; if(!f) return;
        rzone.innerHTML='<div class="split-status">Rasm tayyorlanmoqda…</div>';
        compressImage(f,function(data){
          if(data){ receipt=data; } else { alert('Rasmni o‘qib bo‘lmadi'); }
          paintZone();
        });
      });
      paintZone();
      root._getReceipt=function(){ return receipt; };
      /* ---------- «Chek» rejimi: taomlar ro‘yxati ---------- */
      var billLines = null, billSvc = '';
      function billNewLine(){
        var w = {};
        g.members.forEach(function(m){ w[m.id] = true; });   /* sukut — hammasi */
        return {name:'', amt:0, who:w};
      }
      function billHtml(){
        var h = '<div class="bill-list">';
        billLines.forEach(function(l, i){
          h += '<div class="bill-line">'
             + '<div class="bill-top">'
             + '<input class="bname" data-i="'+i+'" placeholder="Taom nomi" value="'+esc(l.name)+'">'
             + '<input class="bamt" data-i="'+i+'" inputmode="numeric" placeholder="0" value="'+(l.amt>0?l.amt:'')+'">'
             + '<button type="button" class="bill-x" data-bact="del" data-i="'+i+'" aria-label="O‘chirish">×</button>'
             + '</div><div class="bill-who">'
             + g.members.map(function(m){
                 return '<button type="button" data-bact="who" data-i="'+i+'" data-id="'+m.id+'" aria-pressed="'+(!!l.who[m.id])+'">'+esc(m.name)+'</button>';
               }).join('')
             + '<button type="button" class="all" data-bact="all" data-i="'+i+'">hammasi</button>'
             + '</div></div>';
        });
        h += '</div><button type="button" class="btn btn-block" data-bact="add" style="margin-top:10px">+ Qator</button>'
           + '<div class="bill-foot"><label>Xizmat haqi (%) — chekdagi «обслуживание»</label>'
           + '<input id="bsvc" inputmode="decimal" placeholder="0" value="'+esc(billSvc)+'"></div>'
           + '<div class="split-list" style="margin-top:12px">'
           + g.members.map(function(m){
               return '<div class="split-line"><span class="nm">'+esc(m.name)+'</span>'
                    + '<span class="calc" data-id="'+m.id+'"></span></div>';
             }).join('')
           + '</div><div class="split-status" id="sstat"></div>';
        return h;
      }
      function wireBill(){
        box.querySelectorAll('.bname').forEach(function(el){
          el.addEventListener('input', function(){ billLines[+el.dataset.i].name = el.value; });
        });
        box.querySelectorAll('.bamt').forEach(function(el){
          el.addEventListener('input', function(){
            billLines[+el.dataset.i].amt = parseAmount(el.value);
            splitTouched = true; recalc();
          });
          el.addEventListener('change', function(){
            /* ifoda yozilgan bo‘lsa — natijasini ko‘rsatamiz */
            var v = billLines[+el.dataset.i].amt;
            el.value = v > 0 ? String(v) : '';
          });
        });
        box.querySelectorAll('[data-bact]').forEach(function(b){
          b.addEventListener('click', function(){
            var act = b.dataset.bact, i = +b.dataset.i;
            if(act === 'add'){ billLines.push(billNewLine()); rebuild(); return; }
            if(act === 'del'){
              billLines.splice(i, 1);
              if(!billLines.length) billLines.push(billNewLine());
              rebuild(); return;
            }
            if(act === 'all'){
              var l = billLines[i], on = g.members.some(function(m){ return !l.who[m.id]; });
              g.members.forEach(function(m){ l.who[m.id] = on; });
              box.querySelectorAll('[data-bact="who"][data-i="'+i+'"]').forEach(function(x){
                x.setAttribute('aria-pressed', on);
              });
              splitTouched = true; recalc(); return;
            }
            if(act === 'who'){
              var ln = billLines[i];
              ln.who[b.dataset.id] = !ln.who[b.dataset.id];
              b.setAttribute('aria-pressed', !!ln.who[b.dataset.id]);
              splitTouched = true; recalc(); return;
            }
          });
        });
        var sv = box.querySelector('#bsvc');
        if(sv) sv.addEventListener('input', function(){ billSvc = sv.value; splitTouched = true; recalc(); });
      }
      var splitPrev = prevSplitMap(e.splits);
      var hadSplits = !!(e.splits && e.splits.length);
      var memberIds = g.members.map(function(m){return m.id;});
      var exactTouched = {};
      function checkedIds(){ return [].slice.call(box.querySelectorAll('.pcheck:checked')).map(function(c){return c.dataset.id;}); }
      function inputRaw(){ var o={}; [].slice.call(box.querySelectorAll('.sinput')).forEach(function(i){ o[i.dataset.id]=i.value; }); return o; }
      /* "Teng" rejimidagi shaxsiy qo‘shimchalar — bular pul, yaxlitlanadi */
      function extraVals(){ var o={}; [].slice.call(box.querySelectorAll('.xinput')).forEach(function(i){ o[i.dataset.id]=parseAmount(i.value); }); return o; }
      /* Foiz va ulush — pul emas: parseAmount butun songa yaxlitlaydi
         (27,5 → 28), shuning uchun kasrni saqlaydigan parseQty ishlatiladi */
      function inputNums(){ var o={}; [].slice.call(box.querySelectorAll('.sinput')).forEach(function(i){ o[i.dataset.id]=parseQty(i.value); }); return o; }
      function setCalc(map){ box.querySelectorAll('.calc').forEach(function(sp){ sp.textContent=fmtMoney(map[sp.dataset.id]||0); }); }
      function recalc(){
        var stat=box.querySelector('#sstat'); if(!stat) return;
        var amt=amount();
        if(mode==='equal'){
          var ids=checkedIds();
          var ex=extraVals();
          var own0=0;
          memberIds.forEach(function(id){ if(ex[id]>0) own0+=ex[id]; });
          var auto = (own0>0 && !amtTouched);
          if(auto && own0!==amt){ setAmt(own0); amt=own0; }
          var eq=splitEqualPlus(amt, ids, ex, memberIds);
          setCalc(eq.map);
          if(auto){
            stat.textContent='Summa shaxsiy summalardan hisoblandi — '+fmtMoney(eq.own);
            stat.className='split-status';
          }else if(eq.own>amt){
            stat.textContent='Shaxsiy summalar ('+fmtMoney(eq.own)+') umumiy summadan oshib ketdi';
            stat.className='split-status bad';
          }else if(!ids.length){
            stat.textContent = eq.own>0
              ? ('Shaxsiy summa '+fmtMoney(eq.own)+' · qolgani to‘lovchida qoladi')
              : 'Kamida bitta kishi tanlang';
            stat.className='split-status'+(eq.own>0?' warn':' bad');
          }else if(eq.own>0){
            stat.textContent='Shaxsiy summa '+fmtMoney(eq.own)+' · qolgan '+fmtMoney(eq.rest)
              +' — '+ids.length+' kishiga teng, har biriga '+fmtMoney(eq.each);
            stat.className='split-status';
          }else{
            stat.textContent=ids.length+' kishi teng — har biriga '+fmtMoney(eq.each);
            stat.className='split-status';
          }
        }else if(mode==='exact'){
          var touched=Object.keys(exactTouched);
          if(!touched.length && hadSplits){
            setCalc(splitPrev);
            stat.textContent='Hozirgi bo‘linish. O‘zgartirish uchun biror a‘zoning summasini yozing — qolgani boshqalarga teng bo‘linadi.';
            stat.className='split-status';
          }else{
            var r=exactShares(amt, inputRaw(), memberIds);
            setCalc(r.shares);
            if(r.autoIds.length){
              stat.textContent = r.fixedSum>amt
                ? ('Kiritilganlar ('+fmtMoney(r.fixedSum)+') summadan oshib ketdi')
                : ('Qo‘lda: '+fmtMoney(r.fixedSum)+' · qolgan '+fmtMoney(r.remainder)+' — '+r.autoIds.length+' kishiga teng');
              stat.className='split-status'+(r.fixedSum>amt?' bad':'');
            }else{
              var diff=amt-r.fixedSum;
              stat.textContent = diff===0 ? ('Aniq: jami '+fmtMoney(r.fixedSum)+' ✓')
                : ('Jami '+fmtMoney(r.fixedSum)+' ≠ '+fmtMoney(amt)+' — nisbat bo‘yicha bo‘linadi');
              stat.className='split-status'+(diff===0?'':' warn');
            }
          }
        }else if(mode==='bill'){
          var br=splitBill(billLines, parseQty(billSvc), memberIds);
          /* summani odam yozmagan bo‘lsa — chek jamisi o‘zi tushadi */
          if(br.total>0 && !amtTouched && br.total!==amt){ setAmt(br.total); amt=br.total; }
          var bmap={};
          br.rows.forEach(function(x){ bmap[x.memberId]=x.share; });
          setCalc(bmap);
          var nLines=(billLines||[]).filter(function(l){ return l.amt>0; }).length;
          if(!nLines){
            stat.textContent='Taomlarni yozing — nomi va narxi. Yonidagi ismlardan kim yeganini belgilang.';
            stat.className='split-status';
          }else{
            var svcN=parseQty(billSvc);
            stat.textContent = nLines+' ta qator · '+fmtMoney(br.sum)
              + (svcN>0 ? (' + xizmat '+fmtPct(svcN)+'% = '+fmtMoney(br.total)) : '')
              + (amtTouched && amt!==br.total ? (' — yozilgan summa '+fmtMoney(amt)+', nisbat bo‘yicha bo‘linadi') : '');
            stat.className='split-status'+(amtTouched && amt!==br.total ? ' warn' : '');
            if(amtTouched && amt!==br.total){
              /* summa qo‘lda boshqacha yozilgan — chek nisbatida bo‘lamiz */
              var pr2=memberIds.filter(function(id){ return br.raw[id]>0; })
                               .map(function(id){ return {id:id, w:br.raw[id]}; });
              var m2={};
              splitWeighted(amt, pr2).forEach(function(x){ m2[x.memberId]=x.share; });
              setCalc(m2);
            }
          }
        }else if(mode==='pct'){
          var pv=inputNums();
          var pp=Object.keys(pv).map(function(k){ return {id:k, p:pv[k]}; });
          var pr=splitPct(amt, pp), pmap={};
          pr.rows.forEach(function(x){ pmap[x.memberId]=x.share; });
          setCalc(pmap);
          if(pr.totalPct<=0){
            stat.textContent='Kamida bitta foiz kiriting';
            stat.className='split-status bad';
          }else if(pr.totalPct>100.001){
            stat.textContent='Jami '+fmtPct(pr.totalPct)+'% — 100% dan oshib ketdi';
            stat.className='split-status bad';
          }else if(pr.totalPct>99.999){
            stat.textContent='Jami 100% — '+fmtMoney(pr.used)+' ✓';
            stat.className='split-status';
          }else{
            stat.textContent='Jami '+fmtPct(pr.totalPct)+'% ('+fmtMoney(pr.used)+') · qolgan '
              + fmtPct(100-pr.totalPct) + '% bo‘linmaydi';
            stat.className='split-status warn';
          }
        }else{
          var w=inputNums(); var pairs=Object.keys(w).map(function(k){return {id:k,w:w[k]};});
          var res=splitWeighted(amt,pairs), map2={}; res.forEach(function(s){map2[s.memberId]=s.share;});
          setCalc(map2);
          var parts=res.filter(function(s){return s.share>0;}).length;
          stat.textContent = parts>0 ? (parts+' kishi ulush nisbatida bo‘linadi') : 'Kamida bitta ulush kiriting';
          stat.className='split-status'+(parts>0?'':' bad');
        }
      }
      var splitTouched=false;
      function rebuild(){
        if(mode==='bill'){
          if(!billLines) billLines=[billNewLine()];
          box.innerHTML = tr(billHtml());
          wireBill();
          recalc();
          return;
        }
        box.innerHTML=buildSplitBody(mode,g,amount(),splitPrev);
        box.querySelectorAll('.pcheck,.sinput,.xinput').forEach(function(el){
          var mark=function(){
            splitTouched=true;
            if(mode==='exact' && el.classList.contains('sinput')){
              if(!Object.keys(exactTouched).length){
                // birinchi qo‘l bilan o‘zgartirish — qolganlarini "avto" qilamiz
                box.querySelectorAll('.sinput').forEach(function(o){ if(o!==el) o.value=''; });
              }
              exactTouched[el.dataset.id]=true;
            }
            recalc();
          };
          el.addEventListener('input',mark); el.addEventListener('change',mark);
        });
        recalc();
      }
      root.querySelectorAll('#mseg button').forEach(function(b){
        b.addEventListener('click',function(){
          if(mode===b.dataset.m) return;
          mode=b.dataset.m; exactTouched={};
          splitTouched = (mode==='bill' && billLines && billLines.some(function(l){ return l.amt>0; }));
          root.querySelectorAll('#mseg button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.m===mode);});
          rebuild();
        });
      });
      amtInput.addEventListener('input',function(){
        amtTouched = true;                 /* setAmt 'input' yubormaydi — bu faqat odam yozgani */
        if(mode==='shares'||splitTouched) recalc(); else rebuild();
      });
      rebuild();
      root._readSplits=function(){
        var amt=amount();
        if(mode==='equal'){
          var ids=checkedIds();
          var eq=splitEqualPlus(amt, ids, extraVals(), memberIds);
          if(!eq.rows.length || eq.own>amt) return null;
          return eq.rows;
        }
        if(mode==='bill'){
          var br=splitBill(billLines, parseQty(billSvc), memberIds);
          if(!br.rows.length) return null;
          if(amtTouched && amt>0 && amt!==br.total){
            var pr2=memberIds.filter(function(id){ return br.raw[id]>0; })
                             .map(function(id){ return {id:id, w:br.raw[id]}; });
            return splitWeighted(amt, pr2).filter(function(x){ return x.share>0; });
          }
          return br.rows.filter(function(x){ return x.share>0; });
        }
        if(mode==='exact'){
          var touched=Object.keys(exactTouched);
          if(!touched.length && hadSplits){
            // o‘zgartirilmadi — hozirgi bo‘linishni saqlaymiz (summa o‘zgargan bo‘lsa moslashtiramiz)
            var pw=memberIds.filter(function(id){return splitPrev[id]>0;}).map(function(id){return {id:id,w:splitPrev[id]};});
            return pw.length ? splitWeighted(amt, pw) : null;
          }
          var r=exactShares(amt, inputRaw(), memberIds);
          if(r.autoIds.length){
            var arr=memberIds.map(function(id){return {memberId:id, share:r.shares[id]};}).filter(function(x){return x.share>0;});
            return arr.length ? arr : null;
          }
          var fp=memberIds.filter(function(id){return r.shares[id]>0;}).map(function(id){return {id:id,w:r.shares[id]};});
          if(!fp.length) return null;
          if(r.fixedSum===amt) return fp.map(function(p){return {memberId:p.id,share:p.w};});
          return splitWeighted(amt, fp);
        }
        if(mode==='pct'){
          var pv=inputNums();
          var pp=Object.keys(pv).map(function(k){ return {id:k, p:pv[k]}; });
          var pr=splitPct(amt, pp);
          if(!pr.rows.length || pr.totalPct>100.001) return null;
          return pr.rows.filter(function(x){ return x.share>0; });
        }
        var w=inputNums();
        var pairs=Object.keys(w).filter(function(k){return w[k]>0;}).map(function(k){return {id:k,w:w[k]};});
        if(!pairs.length) return null;
        return splitWeighted(amt,pairs);
      };
    },
    onSubmit:function(form){
      var title=form.title.value.trim();       /* majburiy emas — entryTitle() to‘ldiradi */
      var amt=parseAmount(form.amount.value);
      if(amt<=0){ form.amount.focus(); return; }
      var et=modalEl._getEType();
      var splits=modalEl._readSplits();
      if(!splits || !splits.length){
        var st=modalEl.querySelector('#sstat');
        if(st){ st.className='split-status bad'; st.textContent='Bo‘linish to‘g‘ri emas — kishi tanlang, ulush yoki foiz kiriting (foiz 100 dan oshmasin)'; }
        return;
      }
      var selCat=cat(form.categoryId.value)||{};
      var receipt = et==='income' ? null : ((modalEl._getReceipt && modalEl._getReceipt())||null);
      if(receipt && receipt.length>250000){
        alert('Chek rasmi juda katta — rasmsiz saqlanadi.');
        receipt=null;
      }
      var data={
        type:et, title:title, amount:amt, date:form.date.value||today(),
        paidBy:form.paidBy.value, categoryId:form.categoryId.value,
        categoryName: selCat.name||'', splits:splits, receipt:receipt
      };
      form.querySelector('button[type=submit]').textContent='Saqlanmoqda…';
      saveExpenseTo(g, isEdit?e:null, data, function(){ closeModal(); });
    }
  });
}

function openMemberModal(g, existing){
  var m=existing||null;
  openModal(m?'A‘zo ismi':'A‘zo qo‘shish va taklif qilish','<form>'
    +'<div class="field"><label>Ism</label><input name="n" value="'+esc(m?m.name:'')+'" placeholder="Masalan: Ali" autofocus></div>'
    +(m?'':'<div class="note">Saqlagach, «'+'Ali'+'» uchun shaxsiy taklif havolasi chiqadi — uni yuborasiz.</div>')
    +'<button class="btn btn-primary btn-block" type="submit">'+(m?'Saqlash':'Qo‘shish')+'</button>'
    +'</form>',{
    onSubmit:function(f){
      var n=f.n.value.trim(); if(!n) return;
      if(m){
        if(m.id===meId(g)){
          state.me.name=n; save();
          state.groups.forEach(function(gr){ var mm2=myMember(gr); if(mm2) renameMemberCloud(gr, mm2.id, n); });
        }else{
          renameMemberCloud(g, m.id, n);
        }
        closeModal();
      }else{
        addMemberTo(g, n, function(mid){ closeModal(); if(mid) openInviteFor(g.id, mid); });
      }
    }
  });
}
function openSettleModal(g, ex, prefill){
  var s = ex || Object.assign({from:g.members[0].id, to:(g.members[1]||g.members[0]).id, amount:'', date:today()}, prefill||{});
  var opt=function(sel){ return g.members.map(function(m){return '<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(m.name)+'</option>';}).join(''); };
  openModal(ex?'To‘lovni tahrirlash':(prefill?'Hisob-kitobni tasdiqlash':'Qo‘lda hisob-kitob'),'<form>'
    +(prefill?'<div class="note">Kerak bo‘lsa summani o‘zgartiring, so‘ng «Saqlash».</div>':'')
    +'<div class="two">'
    +'<div class="field"><label>Kim to‘ladi</label><select name="from">'+opt(s.from)+'</select></div>'
    +'<div class="field"><label>Kimga</label><select name="to">'+opt(s.to)+'</select></div>'
    +'</div>'
    +'<div class="field"><label>Summa</label><input name="amt" inputmode="numeric" value="'+(s.amount||'')+'" autofocus></div>'
    +'<div class="field"><label>Sana</label><input type="date" name="date" value="'+s.date+'"></div>'
    +'<button class="btn btn-primary btn-block" type="submit">Saqlash</button>'
    +(ex?'<button class="btn btn-danger btn-block" type="button" data-act="del-settle" data-id="'+s.id+'">O‘chirish</button>':'')
    +'</form>',{
    onSubmit:function(f){
      var amt=parseAmount(f.amt.value);
      if(amt<=0 || f.from.value===f.to.value) return;
      var s2={from:f.from.value,to:f.to.value,amount:amt,date:f.date.value||today()};
      saveSettlementTo(g, ex||null, s2, function(){ closeModal(); });
    }
  });
}

function openDataIO(){
  var slim=Object.assign({},state); slim.groups=[]; // guruhlar bulutda
  var json=JSON.stringify(slim,null,2);
  openModal('Shaxsiy ma‘lumot','<div class="note">Bu faqat shaxsiy hamyoningiz (hisoblar, kategoriyalar, amaliyotlar). Guruhlar bulutda — boshqa telefonda o‘sha taklif havolasi bilan kirasiz.</div>'
    +'<div class="field"><label>Nusxa oling</label><textarea class="io" id="ioout" readonly>'+esc(json)+'</textarea></div>'
    +'<button class="btn btn-block" data-act="copy-io">Nusxa olish</button>'
    +'<div style="height:14px"></div>'
    +'<form><div class="field"><label>Boshqa qurilmadan joylang</label><textarea class="io" name="in" placeholder=\'{"version":1,...}\'></textarea></div>'
    +'<button class="btn btn-primary btn-block" type="submit">Joylash va almashtirish</button></form>',{
    onSubmit:function(f){
      try{
        var obj=JSON.parse(f.in.value);

function catOf(i){ return ((i && i.cat) || '').trim() || NOCAT; }

function allCats(){
  var seen={}, out=[];
  curItems().forEach(function(i){ var c=catOf(i); if(!seen[c]){ seen[c]=1; out.push(c); } });
  out.sort(function(a,b){
    if(a===NOCAT) return 1; if(b===NOCAT) return -1;
    return a.localeCompare(b);
  });
  return out;
}
/* turkumlar kesimida: nechta tovar, qoldiq qiymati, foyda */
function catTotals(){
  var by={}, order=allCats();
  order.forEach(function(c){ by[c]={name:c, n:0, value:0, profit:0}; });
  curItems().forEach(function(i){
    var r=by[catOf(i)], F=fifo(i.id);
    r.n++; r.value+=F.leftValue; r.profit+=F.profit;
  });
  return order.map(function(c){ return by[c]; });
}

}
/* serverda hali 'cat' ustuni bo‘lmasligi mumkin — bir marta aniqlab, keyin usiz yuboramiz */
var sbHasItemCat = true, catSqlWarned = false;
/* xuddi shunday: kim o‘zgartirgani uchun updated_by/updated_at */
var sbHasAudit = true, auditSqlWarned = false;
function isMissingAudit(e){
  return sbHasAudit && /updated_by|updated_at|schema cache|column/i.test((e && e.message) || '');
}
function auditSqlHint(){
  if(auditSqlWarned) return;
  auditSqlWarned = true;
  alert('Kim o‘zgartirgani serverda saqlanmadi — «Profil ▸ Serverni yangilash (SQL)» ni yana bir marta bajaring.\n\nAmaliyotning o‘zi saqlandi.');
}
/* yangi qator — kim qo‘shgani; tahrir — kim o‘zgartirgani */
function stampRow(row, existing){
  if(existing){
    if(sbHasAudit){ row.updated_by = SB_UID; row.updated_at = new Date().toISOString(); }
  }else{
    row.created_by = SB_UID;
  }
  return row;
}
/* xuddi shunday: «kimdan / kimga» — ta‘minotchi va klient */
var sbHasParty = true, partySqlWarned = false;
function isMissingParty(e){
  /* «party» so‘zi aniq — audit tekshiruvidan oldin ishlaydi */
  return sbHasParty && /\bparty\b/i.test((e && e.message) || '');
}
function partySqlHint(){
  if(partySqlWarned) return;
  partySqlWarned = true;
  alert('Serveringizda «kimdan / kimga» uchun joy yo‘q — «Profil ▸ Serverni yangilash (SQL)» ni yana bir marta bajaring.\n\nHarakatning o‘zi saqlandi; faqat ta‘minotchi/klient yozilmadi.');
}
function moveRow(g, data, existing){
  var row = {group_id:g.id, item_id:data.itemId, type:data.type, qty:data.qty,
             price:data.price||0, occurred_on:data.date, note:data.note||null};
  if(sbHasParty) row.party = (data.party||'').trim() || null;
  return stampRow(row, existing);
}
/* eski serverda ustun bo‘lmasa — usiz qayta yuboramiz (party, keyin audit) */
function sendRetry(send){
  var tries = 0;
  var attempt = function(){
    return send().then(function(r){
      if(r.error && tries < 3){
        if(isMissingParty(r.error)){ tries++; sbHasParty=false; partySqlHint(); return attempt(); }
        if(isMissingAudit(r.error)){ tries++; sbHasAudit=false; auditSqlHint(); return attempt(); }
      }
      return r;
    });
  };
  return attempt();
}
function itemRow(g, data){
  var row={group_id:g.id, name:data.name, unit:data.unit, min_qty:data.min||0};
  if(sbHasItemCat) row.cat = (data.cat||'').trim() || null;
  return row;
}
function isMissingCat(e){
  return sbHasItemCat && /\bcat\b|schema cache|column/i.test((e && e.message) || '');
}
function catSqlHint(){
  if(catSqlWarned) return;
  catSqlWarned = true;
  alert('Serveringizda turkum uchun joy yo‘q — «Profil ▸ Serverni yangilash (SQL)» ni yana bir marta bajaring.\n\nTovarlar va boshqa hamma narsa saqlandi; faqat turkum guruh omborida yozilmadi.');
}
function saveItemCloud(g, existing, data, done){
  if(!canEdit(g)){ stockDenied(); return; }
  var send = function(){
    var row = itemRow(g, data);
    return existing ? SB.from('stock_items').update(row).eq('id',existing.id)
                    : SB.from('stock_items').insert(row).select().single();
  };
  send().then(function(r){
    if(r.error && isMissingCat(r.error)){ sbHasItemCat=false; catSqlHint(); return send(); }
    return r;
  }).then(function(r){
    if(r.error) throw r.error;
    return loadGroups().then(function(){ done && done(r.data ? r.data.id : (existing&&existing.id)); });
  }).catch(sbFail);
}

    if(gg && (gg.items||[]).filter(function(x){ return x.id===id; }).length){ alert(sqlNeeded('Tovarni o‘chirib bo‘lmadi')); return; }
    done && done();
  }).catch(sbFail);
}
function saveMoveCloud(g, existing, data, done){

    return existing ? SB.from('stock_moves').update(row).eq('id',existing.id)
                    : SB.from('stock_moves').insert(row);
  };
  sendRetry(send).then(function(r){
    if(r.error) throw r.error;
    return loadGroups().then(function(){ done && done(); });
  }).catch(sbFail);
}
function deleteMoveCloud(g, id, done){

}

function itm(id){ return curItems().filter(function(x){ return x.id===id; })[0]; }

/* oxirgi narx — eng kech sana; sana teng bo‘lsa keyin kiritilgani.
   Prihod va rasxod narxi alohida eslab qolinadi. */
function lastPriceOf(id, type){
  var best=null, bi=-1;
  curStock().forEach(function(m,ix){
    if(m.itemId!==id || m.type!==type || !(m.price>0)) return;
    if(!best || m.date>best.date || (m.date===best.date && ix>bi)){ best=m; bi=ix; }
  });
  return best ? best.price : 0;
}

function partyHints(type){

/* o‘rtacha kirim narxi — jami prihod puli / jami prihod miqdori */
function avgInPrice(id){
  var q=0, sm=0;
  curStock().forEach(function(m){
    if(m.itemId!==id || m.type!=='in' || !(m.price>0)) return;
    q += m.qty; sm += m.qty*m.price;
  });
  return q>0 ? sm/q : 0;
}
/* ---------- FIFO: oldin kelgan oldin ketadi ----------
   Har bir rasxod eng eski prihod partiyasidan yechiladi, tannarx o‘sha
   partiyaning narxida olinadi. Qoldiq esa qolgan partiyalar narxida turadi. */
function fifo(id){
  var ms = curStock().map(function(m,ix){ return {m:m, ix:ix}; })
    .filter(function(x){ return x.m.itemId===id; })
    .sort(function(a,b){
      return a.m.date<b.m.date ? -1 : a.m.date>b.m.date ? 1 : (a.ix-b.ix);
    })
    .map(function(x){ return x.m; });

  var lots=[], cogs=0, sale=0, soldQty=0, short=0, perMove={};
  ms.forEach(function(m){
    if(m.type==='in'){ lots.push({qty:m.qty, price:m.price||0}); return; }
    var need=m.qty, cost=0;
    while(need>1e-9 && lots.length){
      var l=lots[0], take=Math.min(need, l.qty);
      cost += take*l.price; l.qty -= take; need -= take;
      if(l.qty<=1e-9) lots.shift();
    }
    var amt=m.qty*(m.price||0);
    cogs+=cost; sale+=amt; soldQty+=m.qty;
    if(need>1e-9) short+=need;            /* omborda yo‘q edi — tannarxsiz ketdi */
    perMove[m.id]={cost:cost, sale:amt, profit:amt-cost, uncovered:need};
  });
  var leftValue=0, leftQty=0;
  lots.forEach(function(l){ leftValue+=l.qty*l.price; leftQty+=l.qty; });
  return { cogs:cogs, sale:sale, profit:sale-cogs, soldQty:soldQty,
           leftValue:leftValue, leftQty:leftQty, short:short, perMove:perMove };
}
/* bitta oyning ombor natijasi: o‘sha oyda sotilganlar bo‘yicha
   sotuv, tannarx va FIFO foyda. perMove har bir rasxodning tannarxini beradi. */
function monthStock(p){
  var out = {sale:0, cogs:0, profit:0, has:false};
  if(!omborCanSee()) return out;
  var items = curItems();
  out.has = items.length > 0;
  if(!out.has) return out;
  var inMonth = {};
  curStock().forEach(function(m){
    if(m.type==='out' && inPeriod(m.date, p)) inMonth[m.id]=1;
  });
  items.forEach(function(i){
    var pm = fifo(i.id).perMove;
    Object.keys(pm).forEach(function(mid){
      if(!inMonth[mid]) return;
      out.sale += pm[mid].sale;
      out.cogs += pm[mid].cost;
    });
  });
  out.profit = out.sale - out.cogs;
  return out;
}

/* qoldiq qiymati — FIFO bo‘yicha qolgan partiyalar narxida */
function itemValue(id){ return fifo(id).leftValue; }
/* butun ombor bo‘yicha foyda */
function stockProfit(){
  return curItems().reduce(function(a,i){ return a + fifo(i.id).profit; }, 0);
}
function stockCogs(){
  return curItems().reduce(function(a,i){ return a + fifo(i.id).cogs; }, 0);
}
/* arzon birlik narxlari uchun kasrni ham ko‘rsatamiz (7.09 so‘m) */
function fmtPrice(n){
  n = Number(n)||0;
  if(!n) return '—';
  if(n < 1000){
    var r = Math.round(n*100)/100;
    var t = (r%1===0) ? String(r) : r.toFixed(2).replace(/0$/,'');
    return t + (state.currency==='UZS' ? " so'm" : (' '+state.currency));
  }
  return fmtMoney(n);
}
function stockTotal(){ return curItems().reduce(function(a,i){ return a + itemValue(i.id); }, 0); }
/* prihod yoki rasxodning pul summasi (butun ombor bo‘yicha yoki bitta tovar bo‘yicha) */
function moveSum(type, itemId){
  return curStock().reduce(function(a,m){
    if(m.type!==type) return a;
    if(itemId && m.itemId!==itemId) return a;
    return a + m.qty*(m.price||0);
  }, 0);
}
function isLow(i){ return (i.min||0) > 0 && itemQty(i.id) <= i.min; }
function parseQty(v){
  var c=calcOf(v); if(c!==null) return Math.round(c*1000)/1000;
  var n = parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,''));
  return isFinite(n) ? n : 0;
}
function fmtQty(n, unit){
  var s = (Math.round(n*1000)/1000).toLocaleString('en-US').replace(/,/g,' ');
  return s + (unit ? (' '+unit) : '');
}
function itemOptions(sel){

    return '<option value="'+i.id+'"'+(i.id===sel?' selected':'')+'>'+esc(i.name)+'</option>';
  }).join('') + '<option value="__new">+ Yangi tovar…</option>';
}

/* kassa bilan bog‘lash: prihod → chiqim, rasxod → kirim */
function ensureCat(id, name, kind){
  if(!state.categories.filter(function(c){ return c.id===id; }).length){
    state.categories.push({id:id, name:name, kind:kind});
  }
  return id;
}
function moveTxData(m, accountId){
  var amt = Math.round(m.qty * (m.price||0));
  if(amt <= 0) return null;
  var it = itm(m.itemId);
  var inn = m.type==='in';
  return {
    accountId: accountId || firstAccountId(),
    categoryId: inn ? ensureCat('c_tovar','Tovar / Mahsulot','expense')
                    : ensureCat('c_sotuv','Savdo tushumi','income'),
    amount: amt,
    type: inn ? 'expense' : 'income',
    note: (it?it.name:'Tovar') + ' — ' + (inn?'prihod':'rasxod') + ' ' + fmtQty(m.qty, it && it.unit),
    date: m.date
  };
}
function moveTx(m){
  return m.txId ? state.transactions.filter(function(t){ return t.id===m.txId; })[0] : null;
}
function syncMoveTx(m, want, accountId){
  var old = moveTx(m);
  var d = want ? moveTxData(m, accountId || (old && old.accountId)) : null;
  if(!d){
    if(old) state.transactions = state.transactions.filter(function(t){ return t.id!==m.txId; });
    m.txId = null;
    return;
  }
  if(old){ for(var k in d){ if(d.hasOwnProperty(k)) old[k]=d[k]; } }
  else {
    var t = {id:uid(), accountId:d.accountId, categoryId:d.categoryId, amount:d.amount,
             type:d.type, note:d.note, date:d.date};
    state.transactions.push(t);
    m.txId = t.id;
  }
}
/* telefondagi ombordan harakatni o‘chirish (bog‘langan kassa yozuvi bilan) */
function dropMove(id){
  var m = state.stock.filter(function(x){ return x.id===id; })[0];
  if(!m) return;
  if(m.txId) state.transactions = state.transactions.filter(function(t){ return t.id!==m.txId; });
  state.stock = state.stock.filter(function(x){ return x.id!==id; });
}

  /* grafik: tovarlar bo‘yicha qoldiq qiymati yoki foyda */
  var metric = (state.settings && state.settings.stockChart) || 'value';

  rows.sort(function(a,b){ return Math.abs(b.value)-Math.abs(a.value); });

    var tail = rows.slice(5).reduce(function(a,r){ return a+r.value; }, 0);

  var och = barList(rows, metric==='profit' ? null : '--ch-in');

/* telefondagi omborni guruhga ko‘chirish taklifi */
function migrateCard(g){
  return '<div class="card"><div class="card-h"><h2>Ombor ikkiga bo‘lingan</h2></div>'
    + '<div class="note" style="margin-bottom:10px">Telefoningizda alohida '+state.items.length+' ta tovar va '
    + state.stock.length+' ta harakat qolgan. Ularni «'+esc(g.name)+'» omboriga ko‘chiring — '
    + 'shunda ombor bitta bo‘ladi va guruh a‘zolari ham ko‘radi.</div>'
    + '<button class="btn btn-primary btn-block" data-act="migrate-stock" data-gid="'+g.id+'">Bitta omborga birlashtirish</button></div>';
}
/* ketma-ket yuboramiz: avval tovarlar, keyin ularning harakatlari */
function migrateStock(g){
  if(!canEdit(g)){ stockDenied(); return; }
  if(!state.items.length){ alert('Telefonda ko‘chiriladigan tovar yo‘q.'); return; }
  if(!confirm('Telefondagi '+state.items.length+' ta tovar va '+state.stock.length+' ta harakat «'+g.name+'» omboriga ko‘chiriladi.\n\nShundan keyin ombor bitta bo‘ladi: telefondagi alohida nusxa o‘chadi, ma‘lumot serverda saqlanadi. Kassadagi pul amaliyotlariga tegilmaydi.\n\nDavom etilsinmi?')) return;

  var mkRows = function(){
    return state.items.map(function(i){
      return itemRow(g, {name:i.name, unit:i.unit||'dona', min:i.min||0, cat:i.cat||''});
    });
  };
  var sendItems = function(){ return SB.from('stock_items').insert(mkRows()).select(); };
  sendItems().then(function(r){
    /* eski serverda 'cat' ustuni yo‘q — turkumsiz qayta yuboramiz, ko‘chirish yiqilmasin */
    if(r.error && isMissingCat(r.error)){ sbHasItemCat=false; catSqlHint(); return sendItems(); }
    return r;
  }).then(function(r){
    if(r.error) throw r.error;
    /* eski id → yangi id */
    var map={}, made=r.data||[];
    state.items.forEach(function(old, ix){ if(made[ix]) map[old.id]=made[ix].id; });
    var src = state.stock.filter(function(m){ return map[m.itemId]; });
    if(!src.length) return {error:null};
    var sendMoves = function(){
      return SB.from('stock_moves').insert(src.map(function(m){
        var row = {group_id:g.id, item_id:map[m.itemId], type:m.type, qty:m.qty,
                   price:m.price||0, occurred_on:m.date, note:m.note||null, created_by:SB_UID};
        if(sbHasParty) row.party = (m.party||'').trim() || null;
        return row;
      }));
    };
    return sendRetry(sendMoves);
  }).then(function(r){
    if(r && r.error) throw r.error;
    return loadGroups();
  }).then(function(){
    /* endi ombor bitta: telefondagi alohida nusxani olib tashlaymiz */
    state.items = []; state.stock = []; save();
    alert('Birlashtirildi. Endi ombor bitta — guruh a‘zolari ham ko‘radi.');
    render();
  }).catch(sbFail);
}

/* ---------- TOVARLAR ro'yxati: qidiruv, filtr, saralash ---------- */
var SORTS = [
  ['name',    'Nomi (A → Z)'],
  ['name-d',  'Nomi (Z → A)'],
  ['qty-d',   'Qoldiq: ko‘pdan kamga'],
  ['qty',     'Qoldiq: kamdan ko‘pga'],
  ['price-d', 'Narxi: qimmatdan arzonga'],
  ['price',   'Narxi: arzondan qimmatga'],
  ['value-d', 'Qoldiq qiymati: kattadan kichikka'],
  ['profit-d','Foydasi: kattadan kichikka'],
  ['date-d',  'Oxirgi harakat: yangidan eskiga']
];
function itemUnitPrice(id){
  var F = fifo(id);
  if(F.leftQty > 0 && F.leftValue > 0) return F.leftValue/F.leftQty;
  return avgInPrice(id) || lastInPrice(id);
}
function lastMoveDate(id){
  var d = '';
  curStock().forEach(function(m){ if(m.itemId===id && m.date>d) d=m.date; });
  return d;
}
function viewItems(){
  var q = (route.q||'').toLowerCase(), f = route.sf||'all';
  var sort = (state.settings && state.settings.itemSort) || 'name';

  var h = '<div class="topbar"><button class="back-btn" data-act="nav" data-screen="ombor">‹ Ombor</button>'
        + (omborCanEdit() ? '<button class="link" data-act="add-item">Tovar +</button>' : '<span class="eyebrow">faqat ko‘rish</span>')
        + '</div>';

  h += '<input class="search" id="omsearch" placeholder="Tovar qidirish…" value="'+esc(route.q||'')+'">';
  h += '<div class="chips">'
     + '<button class="chip" data-act="sfilter" data-f="all" aria-pressed="'+(f==='all')+'">Hammasi</button>'
     + '<button class="chip" data-act="sfilter" data-f="low" aria-pressed="'+(f==='low')+'">Kam qolgan</button>'
     + '<button class="chip" data-act="sfilter" data-f="zero" aria-pressed="'+(f==='zero')+'">Tugagan</button>'
     + '<button class="chip" data-act="sfilter" data-f="profit" aria-pressed="'+(f==='profit')+'">Foyda keltirgan</button>'
     + '</div>';
  var cf = route.cat || '', cl = allCats();
  if(cl.length > 1){
    h += '<div class="chips">'
       + '<button class="chip" data-act="icat" data-c="" aria-pressed="'+(cf==='')+'">Hamma turkum</button>'
       + cl.map(function(c){
           return '<button class="chip" data-act="icat" data-c="'+esc(c)+'" aria-pressed="'+(cf===c)+'">'+esc(c)+'</button>';
         }).join('')
       + '</div>';
  }
  h += '<div class="filters"><select id="omsort">'
     + SORTS.map(function(x){
         return '<option value="'+x[0]+'"'+(x[0]===sort?' selected':'')+'>'+x[1]+'</option>';
       }).join('')
     + '</select></div>';

  var list = curItems().filter(function(i){
    if(q && i.name.toLowerCase().indexOf(q)<0) return false;
    if(f==='low' && !isLow(i)) return false;
    if(f==='zero' && itemQty(i.id)>0) return false;
    if(f==='profit' && fifo(i.id).profit<=0) return false;
    if(cf && catOf(i)!==cf) return false;
    return true;
  });

  list.sort(function(a,b){
    switch(sort){
      case 'name-d':   return b.name.localeCompare(a.name);
      case 'qty-d':    return itemQty(b.id)-itemQty(a.id);
      case 'qty':      return itemQty(a.id)-itemQty(b.id);
      case 'price-d':  return itemUnitPrice(b.id)-itemUnitPrice(a.id);
      case 'price':    return itemUnitPrice(a.id)-itemUnitPrice(b.id);
      case 'value-d':  return fifo(b.id).leftValue-fifo(a.id).leftValue;
      case 'profit-d': return fifo(b.id).profit-fifo(a.id).profit;
      case 'date-d':   return lastMoveDate(b.id)<lastMoveDate(a.id) ? -1 : lastMoveDate(b.id)>lastMoveDate(a.id) ? 1 : 0;
      default:         return a.name.localeCompare(b.name);
    }
  });

  if(!list.length){ h += '<div class="empty">Tovar topilmadi</div>'; return h; }

  h += '<div class="card"><div class="list">';
  list.forEach(function(i){
    var qty = itemQty(i.id), low = isLow(i), F = fifo(i.id);
    var sub;
    if(sort==='profit-d')      sub = 'foyda ' + fmtMoney(F.profit, true);
    else if(sort==='date-d')   sub = lastMoveDate(i.id) ? ('oxirgi harakat · '+fmtDateShort(lastMoveDate(i.id))) : 'harakat yo‘q';
    else if(itemUnitPrice(i.id)) sub = fmtPrice(itemUnitPrice(i.id)) + ' / ' + esc(i.unit||'dona');
    else                       sub = 'narx kiritilmagan';
    if(!cf && cl.length>1 && catOf(i)!==NOCAT) sub = esc(catOf(i)) + ' · ' + sub;
    h += '<div class="row tap" data-act="open-item" data-id="'+i.id+'">'
       + '<div class="avatar" style="background:'+colorFor(i.id)+'">'+esc(initials(i.name))+'</div>'
       + '<div class="main"><div class="t">'+esc(i.name)+(low?' ⚠':'')+'</div>'
       + '<div class="s">'+sub+'</div></div>'
       + '<div class="end"><div class="a '+(qty<=0?'neg':'')+'">'+fmtQty(qty, i.unit)+'</div>'
       + '<div class="s">'+fmtMoney(F.leftValue)+'</div></div></div>';
  });
  h += '</div></div>';
  return h;
}

function mvFilter(){ return {item:route.mi||'', sup:route.ms||'', cli:route.mc||''}; }
function mvMoves(p){
  var f = mvFilter();
  return curStock().map(function(m,ix){ return {m:m, ix:ix}; })
    .filter(function(x){
      var m = x.m;
      if(!inPeriod(m.date, p)) return false;
      if(f.item && m.itemId!==f.item) return false;
      /* '__none' — ta‘minotchi/klient yozilmagan harakatlar */
      var okParty = function(want, type){
        if(m.type!==type) return false;
        var pv = (m.party||'').trim();
        return want==='__none' ? pv==='' : pv===want;
      };
      if(f.sup && !okParty(f.sup, 'in'))  return false;
      if(f.cli && !okParty(f.cli, 'out')) return false;
      return true;
    })
    .sort(function(a,b){ return a.m.date<b.m.date ? 1 : a.m.date>b.m.date ? -1 : (b.ix-a.ix); })
    .map(function(x){ return x.m; });

       + (m.price>0?'<div class="s">'+fmtMoney(m.qty*m.price)+'</div>':'')
       + (pm ? '<div class="s '+(pm.profit<0?'neg':'pos')+'">foyda '+fmtMoney(pm.profit,true)+'</div>' : '')
       + '</div></div>';
  });
  return h + '</div></div>';
}

    + '<div style="height:10px"></div>'

    + '</form>';
  openModal(isEdit?'Tovarni tahrirlash':'Yangi tovar', body, {

                  cat:(form.cat ? form.cat.value.trim() : '')};

      if(onDone) onDone(newId || i.id);
    }
  });
}

    + (isEdit?'<button class="btn btn-danger btn-block" type="button" data-act="del-move" data-id="'+m.id+'">O‘chirish</button>':'')

      var suggestPrice = function(){
        if(isEdit) return;
        /* bo‘sh bo‘lsa doim taklif qilamiz; aks holda faqat o‘zimiz qo‘ygan
           narx turgan bo‘lsa — foydalanuvchi yozganiga tegmaymiz */
        if(form.price.value !== '' && String(form.price.value) !== String(suggested)) return;
        var np = lastPriceOf(form.itemId.value, type) || '';
        suggested = String(np);
        form.price.value = suggested;
      };
      /* Kimdan / kimga — tanlanadi yoki yangisi yoziladi (tovarga o‘xshab).
         Prihod va rasxod ro‘yxati alohida: ta‘minotchi va klient. */
      var psel = form.party, pnew = form.partyNew;
      var fillParty = function(keep){
        var cur = (keep!=null) ? keep : ((m.party||'').trim());

        if(cur && list.indexOf(cur)<0) list = [cur].concat(list);
        psel.innerHTML = '<option value="">'+tr('— yo‘q —')+'</option>'
          + list.map(function(x){ return '<option value="'+esc(x)+'">'+esc(x)+'</option>'; }).join('')
          + '<option value="__new">'+tr('+ Yangi…')+'</option>';
        psel.value = (cur && list.indexOf(cur)>=0) ? cur : '';
        pnew.hidden = true; pnew.value = '';
        root.querySelector('#mpartyl').textContent = tr(partyLabel(type));
      };
      psel.addEventListener('change', function(){
        if(psel.value==='__new'){ pnew.hidden=false; pnew.focus(); }
        else { pnew.hidden=true; pnew.value=''; }
      });
      fillParty();
      var paint = function(){
        var it = itm(form.itemId.value);
        var unit = (it && it.unit) || 'dona';
        root.querySelector('#mpl').textContent = (type==='in' ? 'Kirim narxi' : 'Sotish narxi') + ' (1 '+unit+')';

        var amt = parseQty(form.qty.value) * parseAmount(form.price.value);
        var txt;
        if(!form.kassa.checked){
          txt = type==='in'
            ? 'Faqat ombor hisobi: qoldiq ko‘payadi, pul harakati yozilmaydi. Tovar puli ham hisobga olinsin desangiz, yuqoridagi katakchani belgilang.'
            : 'Faqat ombor hisobi: qoldiq kamayadi, pul harakati yozilmaydi. Sotuvdan tushgan pul ham hisobga olinsin desangiz, katakchani belgilang.';
        }else if(amt > 0){
          txt = type==='in'
            ? 'Amaliyotlar bo‘limiga ' + fmtMoney(amt) + ' CHIQIM yoziladi — tovar uchun to‘langan pul.'
            : 'Amaliyotlar bo‘limiga ' + fmtMoney(amt) + ' KIRIM yoziladi — sotuvdan tushgan pul.';
        }else{
          txt = 'Miqdor va narxni kiriting — summa shu yerda ko‘rinadi.';
        }
        root.querySelector('#mhint').textContent = txt;
      };
      root.querySelectorAll('#mseg button').forEach(function(b){
        b.addEventListener('click', function(){
          type = b.dataset.t;
          root.querySelectorAll('#mseg button').forEach(function(x){
            x.setAttribute('aria-pressed', x.dataset.t===type);
          });
          suggestPrice();
          fillParty('');          /* ta‘minotchi va klient ro‘yxati alohida */
          paint();
        });
      });
      form.itemId.addEventListener('change', function(){
        if(form.itemId.value==='__new'){
          form.itemId.value = m.itemId;            /* tanlovni qaytaramiz */
          var keepType = type;
          openItemModal(null, function(newId){     /* yangi tovar ochildi — shu tovar bilan davom etamiz */
            openStockModal(null, newId, keepType);
          });
          return;
        }
        suggestPrice();
        paint();
      });
      if(form.kassa) form.kassa.addEventListener('change', function(){
        root.querySelector('#maccf').hidden = !form.kassa.checked;
        paint();
      });
      /* Summa ↔ narx: narx yoki miqdor yozilsa summa chiqadi,
         summa yozilsa — miqdorga bo‘linib dona narxi chiqadi. */
      var totalInp = form.total, syncing = false;
      var setVal = function(inp, v){
        syncing = true;
        inp.value = (v > 0) ? String(v) : '';
        syncing = false;
      };
      var fromPrice = function(){
        if(syncing) return;
        var q = parseQty(form.qty.value), pr = parseAmount(form.price.value);
        setVal(totalInp, (q > 0 && pr > 0) ? Math.round(q * pr) : 0);
      };
      var fromTotal = function(){
        if(syncing) return;
        var q = parseQty(form.qty.value), t = parseAmount(totalInp.value);
        if(q > 0 && t > 0) setVal(form.price, Math.round(t / q));
      };
      form.qty.addEventListener('input', function(){ fromPrice(); paint(); });
      form.price.addEventListener('input', function(){ fromPrice(); paint(); });
      totalInp.addEventListener('input', function(){ fromTotal(); paint(); });
      fromPrice();            /* tahrirlashda summa darrov to‘lsin */
      paint();
      root._getType = function(){ return type; };
    },
    onSubmit:function(form){
      var type = modalEl._getType();
      var qty = parseQty(form.qty.value);
      if(qty <= 0){ form.qty.focus(); return; }
      var data = {
        itemId: form.itemId.value, type: type, qty: qty,
        price: parseAmount(form.price.value),
        date: form.date.value || today(),
        note: form.note.value.trim(),
        party: (form.party.value==='__new' ? form.partyNew.value : form.party.value).trim()
      };
      var g2 = omborGroup();
      if(g2){
        closeModal();
        saveMoveCloud(g2, isEdit?m:null, data, null);
        return;
      }
      var target = isEdit ? m : {id:uid()};
      target.itemId=data.itemId; target.type=data.type; target.qty=data.qty;
      target.price=data.price; target.date=data.date; target.note=data.note;
      target.party=data.party;
      if(!isEdit){ target.txId = null; state.stock.push(target); }
      syncMoveTx(target, form.kassa && form.kassa.checked, form.accountId ? form.accountId.value : null);
      closeModal(); commit();
    }
  });
}

/* ---------- GRAFIKA ---------- */
/* ranglar :root dagi --ch-in / --ch-out (CVD bo‘yicha tekshirilgan juftlik) */

function fmtCompact(n){
  n = Math.round(Math.abs(n));
  if(n >= 1000000) return String(Math.round(n/100000)/10).replace('.',',')+' mln';
  if(n >= 10000)   return Math.round(n/1000)+' ming';
  if(n >= 1000)    return String(Math.round(n/100)/10).replace('.',',')+' ming';
  return String(n);
}
/* ustun: tepasi yumaloq, poyasi to‘g‘ri (ustun chizig‘idan o‘sadi) */
function colPath(x,y,w,h,r){
  r = Math.min(r, h, w/2);
  return 'M'+x+' '+(y+h)+' V'+(y+r)+' Q'+x+' '+y+' '+(x+r)+' '+y
       + ' H'+(x+w-r)+' Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+' V'+(y+h)+' Z';
}

/* pastga o‘sadigan ustun: poyasi yumaloq, tepasi nol chizig‘ida tekis */
function colPathDown(x,y,w,h,r){
  r = Math.min(r, h, w/2);
  return 'M'+x+' '+y+' V'+(y+h-r)+' Q'+x+' '+(y+h)+' '+(x+r)+' '+(y+h)
       + ' H'+(x+w-r)+' Q'+(x+w)+' '+(y+h)+' '+(x+w)+' '+(y+h-r)+' V'+y+' Z';
}

/* A‘zolar balansi — nol chizig‘idan yuqorida yashil (puli bor),
   pastda qizil (qarzdor). Ikkala tomon bitta o‘lchovda. */
function balanceChart(g, net){
  var rows = (g.members||[]).map(function(m){
    return { id:m.id, name:m.name, me:(m.id===meId(g)), v:(net[m.id]||0) };
  }).sort(function(a,b){ return b.v-a.v; });
  if(rows.length < 2) return '';

  var maxAbs = 0, hasPos = false, hasNeg = false;
  rows.forEach(function(r){
    var a = Math.abs(r.v);
    if(a > maxAbs) maxAbs = a;
    if(r.v > 1) hasPos = true;
    if(r.v < -1) hasNeg = true;
  });
  if(maxAbs < 1) return '';

  var n = rows.length, showVal = n <= 6;
  var PH = 58, L = 6, R = 330, W = 336;
  var top = showVal ? 15 : 6;
  var posH = hasPos ? PH : 0, negH = hasNeg ? PH : 0;
  var zeroY = top + posH;
  var negEnd = zeroY + negH;
  var nameY = negEnd + (showVal && hasNeg ? 25 : 14);
  var H = nameY + 5;

  var band = (R-L)/n;
  var bw = Math.max(9, Math.min(30, band-16));

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'
    + esc('A‘zolar balansi: yuqorida puli borlar, pastda qarzdorlar') + '">';
  /* nol chizig‘i */
  svg += '<line x1="'+L+'" y1="'+zeroY+'" x2="'+R+'" y2="'+zeroY+'" style="stroke:var(--line)" stroke-width="1"/>';

  rows.forEach(function(r,i){
    var cx = L + i*band + band/2, x = cx - bw/2;
    var pos = r.v > 1, neg = r.v < -1;
    var hgt = Math.max(Math.abs(r.v)/maxAbs*PH, (pos||neg) ? 3 : 0);
    var lbl = esc(r.name) + ' · ' + esc(pos ? 'qaytariladi' : neg ? 'qarzdor' : 'hisob teng')
            + (pos||neg ? ' ' + esc(fmtMoney(Math.abs(r.v))) : '');
    if(pos){
      svg += '<path d="'+colPath(x, zeroY-hgt, bw, hgt, 4)+'" style="fill:var(--ch-in)"><title>'+lbl+'</title></path>';
      if(showVal) svg += '<text x="'+cx.toFixed(1)+'" y="'+(zeroY-hgt-5).toFixed(1)+'" text-anchor="middle" font-size="9.5" style="fill:var(--ink-2)">+'+fmtCompact(r.v)+'</text>';
    }else if(neg){
      svg += '<path d="'+colPathDown(x, zeroY, bw, hgt, 4)+'" style="fill:var(--ch-out)"><title>'+lbl+'</title></path>';
      if(showVal) svg += '<text x="'+cx.toFixed(1)+'" y="'+(zeroY+hgt+12).toFixed(1)+'" text-anchor="middle" font-size="9.5" style="fill:var(--ink-2)">−'+fmtCompact(r.v)+'</text>';
    }else{
      svg += '<rect x="'+x.toFixed(1)+'" y="'+(zeroY-1.5)+'" width="'+bw+'" height="3" rx="1.5" style="fill:var(--ink-3)"><title>'+lbl+'</title></rect>';
    }
    var nm = r.name.length > (n>4 ? 7 : 10) ? r.name.slice(0, (n>4?6:9))+'…' : r.name;
    svg += '<text x="'+cx.toFixed(1)+'" y="'+nameY+'" text-anchor="middle" font-size="9.5" style="fill:var(--ink-3)">'
         + esc(nm) + (r.me ? ' •' : '') + '</text>';
  });
  svg += '</svg>';

  return '<div class="card"><div class="card-h"><h2>Kim qancha</h2></div>'
    + '<div class="chleg"><span><i style="background:var(--ch-in)"></i>Puli bor</span>'
    + '<span><i style="background:var(--ch-out)"></i>Qarzdor</span></div>'
    + '<div class="chart">'+svg+'</div></div>';
}

/* oxirgi 6 oy: kirim va chiqim ustunlari */
function monthChart(ym, n){
  n = n || 6;
  var ms=[], k;
  for(k=n-1;k>=0;k--) ms.push(shiftMonth(ym,-k));
  var data = ms.map(function(m){
    var gS=groupMonthShares(m), inc=gS.inc, exp=gS.exp;
    monthTx(m).forEach(function(t){
      if(t.type==='income') inc+=t.amount; else if(t.type==='expense') exp+=t.amount;
    });
    return {ym:m, inc:inc, exp:exp};
  });
  var max=0;
  data.forEach(function(d){ if(d.inc>max) max=d.inc; if(d.exp>max) max=d.exp; });
  if(max<=0) return '';

  var W=336, H=142, L=40, R=330, base=108, top=10, ph=base-top;
  var band=(R-L)/n;
  var bw=Math.max(5, Math.min(15, (band-6)/2)), gap=2, pair=bw*2+gap, off=(band-pair)/2;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Oxirgi '+n+' oy kirim va chiqim">';
  [0,0.5,1].forEach(function(f){
    var y=base-ph*f;
    svg+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>'
       + '<text x="'+(L-6)+'" y="'+(y+3.4).toFixed(1)+'" text-anchor="end" font-size="9" style="fill:var(--ink-3)">'
       + (f===0 ? '0' : fmtCompact(max*f)) + '</text>';
  });
  data.forEach(function(d,i){
    var x=L+i*band+off;
    var hi=d.inc/max*ph, he=d.exp/max*ph;
    var lab=monthLabel(d.ym);
    if(hi>0) svg+='<path d="'+colPath(x,base-hi,bw,hi,4)+'" style="fill:var(--ch-in)">'
                + '<title>'+esc(lab)+' · Kirim '+esc(fmtMoney(d.inc))+'</title></path>';
    if(he>0) svg+='<path d="'+colPath(x+bw+gap,base-he,bw,he,4)+'" style="fill:var(--ch-out)">'
                + '<title>'+esc(lab)+' · Chiqim '+esc(fmtMoney(d.exp))+'</title></path>';
    if(n<=6 || i%2===1)
      svg+='<text x="'+(x+pair/2).toFixed(1)+'" y="'+(base+15)+'" text-anchor="middle" font-size="9.5" style="fill:var(--ink-3)">'
         + UZMONTH_SHORT[parseInt(d.ym.slice(5,7),10)-1] + '</text>';
  });
  svg+='</svg>';
  return '<div class="chleg"><span><i style="background:var(--ch-in)"></i>Kirim</span>'
       + '<span><i style="background:var(--ch-out)"></i>Chiqim</span></div>'
       + '<div class="chart">'+svg+'</div>';
}

/* bitta oy tanlanganda — kunlar bo‘yicha kirim/chiqim */
function dayChart(ym){
  var y = parseInt(ym.slice(0,4),10), mo = parseInt(ym.slice(5,7),10);
  var days = new Date(y, mo, 0).getDate();
  var inc = [], exp = [], i;
  for(i=0;i<=days;i++){ inc.push(0); exp.push(0); }

  state.transactions.forEach(function(t){
    if((t.date||'').slice(0,7)!==ym) return;
    var d = parseInt(t.date.slice(8,10),10);
    if(!(d>=1 && d<=days)) return;
    if(t.type==='income') inc[d]+=t.amount;
    else if(t.type==='expense') exp[d]+=t.amount;
  });
  /* guruhlardan — o‘z ulushim (oylik raqam bilan bir xil bo‘lishi uchun) */
  state.groups.forEach(function(g){
    (g.expenses||[]).forEach(function(e){
      if((e.date||'').slice(0,7)!==ym) return;
      var sh = myShareIn(g,e); if(sh<=0) return;
      var d = parseInt((e.date||'').slice(8,10),10);
      if(!(d>=1 && d<=days)) return;
      if(entryType(e)==='income') inc[d]+=sh; else exp[d]+=sh;
    });
  });

  var max=0;
  for(i=1;i<=days;i++){ if(inc[i]>max) max=inc[i]; if(exp[i]>max) max=exp[i]; }
  if(max<=0) return '';

  /* har bir kun o‘z sanasi bilan ko‘rinishi uchun grafik yon tomonga suriladi */
  var H=148, L=56, base=108, top=10, ph=base-top;   /* L — chapdagi qiymat ustuni kengligi */
  var band=24, bw=10, gap=2, pair=bw*2+gap, off=(band-pair)/2;
  var W=days*band+8;

  /* chapdagi qimmat o‘qi — surilmaydi */
  var ax='<svg class="chaxis" viewBox="0 0 '+L+' '+H+'" width="'+L+'" height="'+H+'">';
  [0,0.5,1].forEach(function(f){
    var yy=base-ph*f;
    ax+='<text x="'+(L-6)+'" y="'+(yy+3.4).toFixed(1)+'" text-anchor="end" font-size="9" style="fill:var(--ink-3)">'
      + (f===0 ? '0' : fmtCompact(max*f)) + '</text>';
  });
  ax+='</svg>';

  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'
        + esc(monthLabel(ym)) + ' — kunlar bo‘yicha kirim va chiqim">';
  [0,0.5,1].forEach(function(f){
    var yy=base-ph*f;
    svg+='<line x1="0" y1="'+yy.toFixed(1)+'" x2="'+W+'" y2="'+yy.toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>';
  });
  for(i=1;i<=days;i++){
    var x=(i-1)*band+off;
    var hi=inc[i]/max*ph, he=exp[i]/max*ph;
    var dlab=i+'-'+UZMONTH_SHORT[mo-1];
    var dIso=ym+'-'+String(i).padStart(2,'0');
    svg+='<rect x="'+((i-1)*band).toFixed(1)+'" y="'+top+'" width="'+band+'" height="'+(ph+10)+'"'
       + ' fill="transparent" style="cursor:pointer" data-act="open-day" data-d="'+dIso+'">'
       + '<title>'+esc(dlab)+(inc[i]>0?(' · Kirim '+esc(fmtMoney(inc[i]))):'')
       + (exp[i]>0?(' · Chiqim '+esc(fmtMoney(exp[i]))):'')+' — hisobot uchun bosing</title></rect>';
    if(hi>0) svg+='<path d="'+colPath(x, base-hi, bw, hi, 4)+'" style="fill:var(--ch-in);pointer-events:none"/>';
    if(he>0) svg+='<path d="'+colPath(x+bw+gap, base-he, bw, he, 4)+'" style="fill:var(--ch-out);pointer-events:none"/>';
    svg+='<text x="'+(x+pair/2).toFixed(1)+'" y="'+(base+16)+'" text-anchor="middle" font-size="10"'
       + ' style="fill:var(--ink-'+((inc[i]>0||exp[i]>0)?'2':'3')+');pointer-events:none">'+i+'</text>';
  }
  svg+='</svg>';

  return '<div class="chleg"><span><i style="background:var(--ch-in)"></i>Kirim</span>'
       + '<span><i style="background:var(--ch-out)"></i>Chiqim</span>'
       + '<span class="xs" style="margin-left:auto;color:var(--ink-3)">← suring</span></div>'
       + '<div class="chart2">'+ax+'<div class="chscroll" id="chscroll">'+svg+'</div></div>';

/* ---------- KUNLIK HISOBOT ---------- */
var UZWEEK = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];

/* bir kunning kirim/chiqimi — Asosiydagi raqamlar bilan bir xil manbadan */
function dayTotals(d){
  var inc=0, exp=0, n=0;
  state.transactions.forEach(function(t){
    if(t.date!==d) return;
    n++;
    if(t.type==='income') inc+=t.amount; else if(t.type==='expense') exp+=t.amount;
  });
  state.groups.forEach(function(g){
    (g.expenses||[]).forEach(function(e){
      if(e.date!==d) return;
      var sh=myShareIn(g,e); if(sh<=0) return;
      n++;
      if(entryType(e)==='income') inc+=sh; else exp+=sh;
    });
  });
  return {inc:inc, exp:exp, net:inc-exp, n:n};
}
function daysIn(ym){ return new Date(parseInt(ym.slice(0,4),10), parseInt(ym.slice(5,7),10), 0).getDate(); }
function dayName(d){ return UZWEEK[new Date(d+'T00:00:00').getDay()]; }

/* ---------- bitta kunning hisoboti ---------- */
function viewDay(){
  var d = route.d || today();
  var T = dayTotals(d);
  var ym = d.slice(0,7);
  var prev = shiftDay(d,-1), next = shiftDay(d,1);

  var h = '<div class="topbar"><button class="back-btn" data-act="nav" data-screen="home">‹ Asosiy</button>'
        + '<div class="monthnav">'
        + '<button class="icon-btn" data-act="open-day" data-d="'+prev+'" aria-label="Oldingi kun">‹</button>'
        + '<span class="month-label">'+fmtDateShort(d)+'</span>'
        + '<button class="icon-btn" data-act="open-day" data-d="'+next+'" aria-label="Keyingi kun">›</button>'
        + '</div></div>';

  h += '<div class="stack">';
  h += '<div class="balance-hero">'
     + '<span class="eyebrow">'+esc(fmtDateLong(d))+' · '+esc(dayName(d))+'</span>'
     + '<span class="big '+(T.net<0?'neg':T.net>0?'pos':'')+'">'+fmtMoney(T.net,true)+'</span>'
     + '<div class="flowrow">'
     + '<div class="flowbox"><div class="k">Kirim</div><div class="v pos">'+fmtMoney(T.inc)+'</div></div>'
     + '<div class="flowbox"><div class="k">Chiqim</div><div class="v neg">'+fmtMoney(T.exp)+'</div></div>'
     + '</div></div>';

  var rows = activityList().filter(function(r){ return r.date===d; })
    .sort(function(a,b){ return b.amount-a.amount; });

  /* kategoriyalar bo‘yicha */
  var cch = catChart(rows, 'expense');
  if(cch) h += '<div class="card"><div class="card-h"><h2>Chiqim — kategoriyalar</h2></div>'+cch+'</div>';

  /* ombor harakatlari */
  var moves = curStock().map(function(m,ix){ return {m:m,ix:ix}; })
    .filter(function(x){ return x.m.date===d; })
    .sort(function(a,b){ return b.ix-a.ix; })
    .map(function(x){ return x.m; });
  if(moves.length){
    var dIn=0, dOut=0, dProfit=0;
    moves.forEach(function(m){
      var amt=m.qty*(m.price||0);
      if(m.type==='in') dIn+=amt;
      else{
        dOut+=amt;
        var F=fifo(m.itemId);
        if(F.perMove[m.id]) dProfit+=F.perMove[m.id].profit;
      }
    });
    h += '<div class="card"><div class="card-h"><h2>Ombor</h2><span class="eyebrow">'+moves.length+' ta harakat</span></div>'
      + (dIn>0  ? '<div class="kv"><span>Prihod</span><b class="neg">'+fmtMoney(dIn)+'</b></div>' : '')
      + (dOut>0 ? '<div class="kv"><span>Sotuv</span><b class="pos">'+fmtMoney(dOut)+'</b></div>' : '')
      + (dOut>0 ? '<div class="kv"><span>Foyda (FIFO)</span><b class="'+(dProfit<0?'neg':dProfit>0?'pos':'')+'">'+fmtMoney(dProfit,true)+'</b></div>' : '')
      + '<div class="list" style="margin-top:6px">';
    moves.forEach(function(m){
      var it=itm(m.itemId), inn=m.type==='in';
      var F=fifo(m.itemId), pm=F.perMove[m.id];
      h += '<div class="row tap" data-act="open-item" data-id="'+m.itemId+'">'
        + '<div class="avatar" style="background:'+colorFor(m.itemId)+'">'+esc(initials(it?it.name:'?'))+'</div>'
        + '<div class="main"><div class="t">'+esc(it?it.name:'O‘chirilgan tovar')+'</div>'
        + '<div class="s">'+(inn?'prihod':'rasxod')+(m.note?' · '+esc(m.note):'')
        + (m.price>0?' · '+fmtPrice(m.price):'')+'</div></div>'
        + '<div class="end"><div class="a">'+(inn?'+':'−')+fmtQty(m.qty, it&&it.unit)+'</div>'
        + (m.price>0?'<div class="s">'+fmtMoney(m.qty*m.price)+'</div>':'')
        + (!inn && pm && m.price>0 ? '<div class="s '+(pm.profit<0?'neg':'pos')+'">foyda '+fmtMoney(pm.profit,true)+'</div>' : '')
        + '</div></div>';
    });
    h += '</div></div>';
  }

  /* amaliyotlar */
  if(rows.length){
    h += '<div class="card"><div class="card-h"><h2>Amaliyotlar</h2><span class="eyebrow">'+rows.length+' ta</span></div><div class="list">';
    rows.forEach(function(r){ h += actRow(r); });
    h += '</div></div>';
  }

  if(!rows.length && !moves.length){
    h += '<div class="empty">Bu kunda yozuv yo‘q.<br>Pastdagi + tugma orqali qo‘shing.</div>';
  }
  h += '</div>';
  return h;
}

/* nomlangan qatorlar: nom — ustun — summa (eng kattasi tepada) */
function barList(rows, cssVar){
  var max=0;
  rows.forEach(function(r){ var v=Math.abs(r.value); if(v>max) max=v; });
  if(max<=0) return '';
  return rows.map(function(r){
    var w=Math.max(Math.abs(r.value)/max*100, 1.5);
    /* cssVar berilmasa — manfiysi qizil, musbati yashil */
    var col = cssVar ? cssVar : (r.value<0 ? '--ch-out' : '--ch-in');
    return '<div class="blrow"><div class="bltop">'
      + '<span class="bln">'+esc(r.name)+'</span><b class="blv">'+fmtMoney(r.value, !cssVar)+'</b></div>'
      + '<div class="bltrack"><span style="width:'+w.toFixed(1)+'%;background:var('+col+')"></span></div></div>';
  }).join('');
}

/* kategoriyalar bo‘yicha reyting (eng ko‘pi tepada, dumi «Boshqa» ga yig‘iladi) */
function catChart(list, type){
  var by={}, any=false;
  list.forEach(function(r){
    if(r.type!==type) return;
    var k=r.catName||'Boshqa';
    by[k]=(by[k]||0)+r.amount; any=true;
  });
  if(!any) return '';
  var rows=Object.keys(by).map(function(k){ return {name:k, value:by[k]}; })
    .sort(function(a,b){ return b.value-a.value; });
  if(rows.length>6){
    var tail=rows.slice(5).reduce(function(a,r){ return a+r.value; },0);
    rows=rows.slice(0,5).concat([{name:'Boshqa', value:tail}]);
  }
  return barList(rows, type==='income' ? '--ch-in' : '--ch-out');
}

/* nusxa olish: clipboard promise qaytaradi — rad etilsa zaxira yo‘lga tushamiz */
function copyText(txt, btn, okText, area){
  var ok = function(){ btn.textContent = okText || 'Nusxa olindi ✓'; };
  var fallback = function(){
    var ta = area || (function(){
      var t=document.createElement('textarea');
      t.value=txt; t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); return t;
    })();
    try{
      ta.focus(); ta.select();
      if(document.execCommand('copy')){ ok(); } else { btn.textContent='Nusxa olinmadi — qo‘lda belgilang'; }
    }catch(e){ btn.textContent='Nusxa olinmadi — qo‘lda belgilang'; }
    if(!area && ta.parentNode) ta.parentNode.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, fallback);
  }else{
    fallback();
  }
}

/* ================= QULF (PIN / grafik kalit / barmoq izi) =================
   Bu — QURILMA qulfi: ma‘lumot baribir shu telefonning xotirasida turadi,
   ya‘ni brauzer vositalaridan o‘qisa bo‘ladi. Maqsadi — telefonni qo‘lga
   olgan odam ilovani ocholmasin. Shuning uchun kalit alohida kalitda
   (`birga_lock`) saqlanadi: ma‘lumotni ko‘chirganda u ko‘chmaydi. */
var LOCK_KEY = 'birga_lock';
var lockEl = document.getElementById('lockscreen');
var lockedNow = false, lockHiddenAt = 0;
function lockCfg(){
  try{ return JSON.parse(localStorage.getItem(LOCK_KEY) || 'null') || null; }catch(e){ return null; }
}
function lockSave(c){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify(c)); }catch(e){} }
function lockClear(){ try{ localStorage.removeItem(LOCK_KEY); }catch(e){} }
function lockOn(){ var c = lockCfg(); return !!(c && c.kind); }
/* SHA-256; eski brauzerda yoki himoyasiz ulanishda oddiy zaxira */
function lockHash(secret, salt, cb){
  var txt = salt + '|' + secret;
  if(!(window.crypto && crypto.subtle && window.TextEncoder)){ cb('x:' + txt); return; }
  try{
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)).then(function(buf){
      var a = Array.prototype.slice.call(new Uint8Array(buf));
      cb(a.map(function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''));
    }).catch(function(){ cb('x:' + txt); });
  }catch(e){ cb('x:' + txt); }
}
function lockSalt(){
  var a = new Uint8Array(12);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(var i=0;i<12;i++) a[i] = Math.floor(Math.random()*256);
  return Array.prototype.slice.call(a).map(function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
}
/* ---- barmoq izi / Face ID: WebAuthn platforma autentifikatori ---- */
function bioMaybe(cb){
  if(!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)){ cb(false); return; }
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
    .then(function(ok){ cb(!!ok); }).catch(function(){ cb(false); });
}
function b64(buf){
  var b = ''; var a = new Uint8Array(buf);
  for(var i=0;i<a.length;i++) b += String.fromCharCode(a[i]);
  return btoa(b);
}
function unb64(str){
  var bin = atob(str), a = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return a;
}
function rnd32(){
  var a = new Uint8Array(32);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  return a;
}
function bioEnroll(cb){
  if(!navigator.credentials || !navigator.credentials.create){ cb(null); return; }
  navigator.credentials.create({publicKey:{
    challenge: rnd32(),
    rp: {name:'Birga Hamyon'},
    user: {id: rnd32(), name:'birga', displayName:'Birga Hamyon'},
    pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
    authenticatorSelection: {authenticatorAttachment:'platform', userVerification:'required'},
    timeout: 60000, attestation: 'none'
  }}).then(function(c){ cb(c ? b64(c.rawId) : null); }).catch(function(){ cb(null); });
}
function bioCheck(id, cb){
  if(!navigator.credentials || !navigator.credentials.get){ cb(false); return; }
  navigator.credentials.get({publicKey:{
    challenge: rnd32(),
    allowCredentials: [{type:'public-key', id: unb64(id)}],
    userVerification: 'required', timeout: 60000
  }}).then(function(c){ cb(!!c); }).catch(function(){ cb(false); });
}
/* ---- grafik kalit: 3×3 nuqta ---- */
function lockGridHtml(){
  var c = '', P = [];
  for(var r=0;r<3;r++) for(var k=0;k<3;k++){
    var x = 42 + k*84, y = 42 + r*84;
    P.push([x,y]);
    c += '<circle class="d" data-i="'+(r*3+k)+'" cx="'+x+'" cy="'+y+'" r="13"></circle>'
       + '<circle class="hit" data-i="'+(r*3+k)+'" cx="'+x+'" cy="'+y+'" r="38" fill="transparent"></circle>';
  }
  /* Chizib ham, nuqtalarni birma-bir bosib ham kiritsa bo‘ladi —
     bosib kiritganda «Tayyor» tugmasi yakunlaydi. */
  return '<svg class="lk-grid" viewBox="0 0 252 252"><path d=""></path>'+c+'</svg>'
    + '<div class="lk-row"><button type="button" class="btn" data-grid-ok>Tayyor</button></div>';
}
function wireGrid(root, done){
  var svg = root.querySelector('.lk-grid');
  if(!svg) return;
  var path = svg.querySelector('path'), seq = [], drawing = false, startLen = 0;
  var pt = function(i){ return [42 + (i%3)*84, 42 + Math.floor(i/3)*84]; };
  var paint = function(){
    path.setAttribute('d', seq.map(function(i,n){ var p=pt(i); return (n?'L':'M')+p[0]+' '+p[1]; }).join(' '));
    svg.querySelectorAll('circle.d').forEach(function(c){
      c.classList.toggle('on', seq.indexOf(+c.dataset.i) >= 0);
    });
  };
  var add = function(t){
    if(!t || !t.dataset || t.dataset.i===undefined) return;
    var i = +t.dataset.i;
    if(seq.indexOf(i) >= 0) return;
    seq.push(i); paint();
  };
  svg.addEventListener('pointerdown', function(ev){
    /* seq ni bu yerda tozalamaymiz: nuqtalarni birma-bir bosib ham
       kiritsa bo‘lsin (chizolmaydiganlar va test uchun) */
    drawing = true; startLen = seq.length;
    try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
    add(document.elementFromPoint(ev.clientX, ev.clientY));
    ev.preventDefault();
  });
  svg.addEventListener('pointermove', function(ev){
    if(!drawing) return;
    add(document.elementFromPoint(ev.clientX, ev.clientY));
    ev.preventDefault();
  });
  var finish = function(){
    if(!drawing) return;
    drawing = false;
    /* Shu harakatda nechta nuqta qo‘shildi: bittasi — bu bosish (yig‘ilaversin,
       «Tayyor» yakunlaydi), ikki va undan ko‘pi — chizib bo‘lindi. */
    if(seq.length - startLen < 2) return;
    var v = seq.join('-');
    setTimeout(function(){ seq = []; paint(); }, 220);
    done(v);
  };
  svg.addEventListener('pointerup', finish);
  svg.addEventListener('pointercancel', finish);
  svg.addEventListener('pointerleave', finish);
  var okb = root.querySelector('[data-grid-ok]');
  if(okb) okb.addEventListener('click', function(){
    if(!seq.length) return;                 /* chizib bo‘lingan — bo‘sh yuborilmasin */
    var v = seq.join('-');
    seq = []; paint();
    done(v);
  });
}
/* ---- PIN klaviaturasi ---- */
function lockPadHtml(okLabel){
  var h = '<div class="lk-pad">';
  [1,2,3,4,5,6,7,8,9].forEach(function(n){ h += '<button type="button" data-k="'+n+'">'+n+'</button>'; });
  h += '<button type="button" class="wide" data-k="del">⌫</button>'
     + '<button type="button" data-k="0">0</button>'
     + '<button type="button" class="wide" data-k="ok">'+(okLabel||'OK')+'</button></div>';
  return h;
}
function lockDotsHtml(n, total){
  var t = (total >= 4 && total <= 6) ? total : 6;
  var h = '<div class="lk-dots">';
  for(var i=0;i<t;i++) h += '<i'+(i<n?' class="on"':'')+'></i>';
  return h + '</div>';
}
/* ================= qulf ekrani ================= */
function lockShow(){
  var cfg = lockCfg();
  if(!cfg || !cfg.kind) return;
  lockedNow = true;
  lockEl.hidden = false;
  document.body.style.overflow = 'hidden';
  var pin = '', tries = 0;
  var draw = function(msg, bad){
    var bio = cfg.bio && cfg.credId;
    lockEl.innerHTML = tr('<div class="lk-title">Birga Hamyon</div>'
      + '<div class="lk-sub'+(bad?' bad':'')+'" id="lksub">'+esc(msg || (cfg.kind==='pin' ? 'PIN kodni kiriting' : 'Grafik kalitni chizing'))+'</div>'
      + (cfg.kind==='pin' ? (lockDotsHtml(pin.length, cfg.len) + lockPadHtml('OK')) : lockGridHtml())
      + (bio ? '<div class="lk-row"><button class="btn" type="button" id="lkbio">Barmoq izi / Face ID</button></div>' : ''));
    if(cfg.kind==='pin'){
      lockEl.querySelectorAll('.lk-pad button').forEach(function(b){
        b.addEventListener('click', function(){
          var k = b.dataset.k;
          if(k === 'del'){ pin = pin.slice(0,-1); draw(); return; }
          if(k === 'ok'){ submit(pin); return; }
          var want = (cfg.len >= 4 && cfg.len <= 6) ? cfg.len : 6;
          if(pin.length >= want) return;
          pin += k;
          draw();
          if(pin.length >= want) submit(pin);
        });
      });
    }else{
      wireGrid(lockEl, function(v){ if(v && v.split('-').length >= 2) submit(v); });
    }
    var bb = lockEl.querySelector('#lkbio');
    if(bb) bb.addEventListener('click', function(){
      bb.disabled = true; bb.textContent = tr('Kutilmoqda…');
      bioCheck(cfg.credId, function(ok){
        bb.disabled = false; bb.textContent = tr('Barmoq izi / Face ID');
        if(ok) lockHide(); else draw('Tanilmadi — qaytadan urinib ko‘ring', true);
      });
    });
  };
  var submit = function(v){
    if(!v){ return; }
    lockHash(v, cfg.salt, function(h){
      if(h === cfg.hash){ lockHide(); return; }
      tries++; pin = '';
      draw(tries >= 3 ? ('Noto‘g‘ri · '+tries+' marta urindingiz') : 'Noto‘g‘ri — qaytadan', true);
    });
  };
  draw();
  /* ochilishi bilan barmoq izini so‘raymiz — odam bosib o‘tirmasin */
  if(cfg.bio && cfg.credId) setTimeout(function(){
    bioCheck(cfg.credId, function(ok){ if(ok && lockedNow) lockHide(); });
  }, 350);
}
function lockHide(){
  lockedNow = false;
  lockEl.hidden = true;
  lockEl.innerHTML = '';
  document.body.style.overflow = '';
}
/* fonda 60 soniyadan ko‘p turgan bo‘lsa — qaytadan so‘raymiz */
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ lockHiddenAt = Date.now(); return; }
  if(!lockOn() || lockedNow) return;
  if(lockHiddenAt && Date.now() - lockHiddenAt > 60000) lockShow();
});

/* ---------- go ---------- */
if(lockOn()) lockShow();
render();
sbReady.then(function(ok){
  if(ok){
    subscribeCloud(); loadGroups();
    SB.auth.onAuthStateChange(function(ev, sess){
      if(ev==='SIGNED_IN' || ev==='SIGNED_OUT' || ev==='USER_UPDATED' || ev==='TOKEN_REFRESHED'){
        var before = SB_UID;
        applySession(sess);
        if(SB_UID && SB_UID!==before){ subscribeCloud(); loadGroups(); }
        else render();
      }
    });
    // realtime ishlamay qolsa — zaxira sifatida vaqti-vaqti bilan yangilash
    setInterval(function(){ if(document.hidden || !modalEl.hidden) return; loadGroups(); }, 25000);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadGroups(); });
  } else {
    try{ state.groups = JSON.parse(localStorage.getItem('birga_groups_cache'))||state.groups||[]; }catch(e){}
    render();
  }
  handleInviteHash();
});

})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
