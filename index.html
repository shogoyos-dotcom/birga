<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Birga Hamyon</title>
<meta name="theme-color" content="#F6F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10130F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Birga">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ground:#F6F5F0;
    --surface:#FFFFFF;
    --surface-2:#EFEDE4;
    --ink:#1B241F;
    --ink-2:#586460;
    --ink-3:#8C948E;
    --line:#E3E1D6;
    --accent:#0E7C6B;
    --accent-ink:#FFFFFF;
    --accent-soft:#E1EFEB;
    --pos:#2F7D4F;
    --neg:#B24A34;
    --warn:#B4832B;
    --ch-in:#07897A;   /* grafikdagi kirim  */
    --ch-out:#B84B30;  /* grafikdagi chiqim */
    --shadow:0 8px 30px rgba(22,32,26,.14);
    --radius:14px;
    --font-display:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#10130F;
      --surface:#191E1A;
      --surface-2:#212722;
      --ink:#E9EBE4;
      --ink-2:#A6ADA4;
      --ink-3:#79817A;
      --line:#2C332C;
      --accent:#4FC4AE;
      --accent-ink:#0A2A24;
      --accent-soft:#1E2E2A;
      --pos:#5FB985;
      --neg:#E0806B;
      --warn:#DDAE5C;
      --ch-in:#2FA891;
      --ch-out:#CF6245;
      --shadow:0 10px 34px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ground:#10130F;
    --surface:#191E1A;
    --surface-2:#212722;
    --ink:#E9EBE4;
    --ink-2:#A6ADA4;
    --ink-3:#79817A;
    --line:#2C332C;
    --accent:#4FC4AE;
    --accent-ink:#0A2A24;
    --accent-soft:#1E2E2A;
    --pos:#5FB985;
    --neg:#E0806B;
    --warn:#DDAE5C;
    --ch-in:#2FA891;
    --ch-out:#CF6245;
    --shadow:0 10px 34px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--font-body);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (min-width:520px){ body{ background:var(--surface-2); } }
  h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
  button{font-family:inherit}
  a{color:var(--accent)}

  .app{
    max-width:460px;margin:0 auto;background:var(--ground);
    min-height:100vh;min-height:100dvh;
  }
  @media (min-width:520px){
    .app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
  }
  #screen{padding:0 16px 132px}

  .topbar{
    position:sticky;top:0;z-index:20;background:var(--ground);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 0 12px;
  }
  .topbar h1{font-size:23px}
  .topbar .sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;
    color:var(--accent);font-weight:600;font-size:14px;padding:6px 0;cursor:pointer
  }

  .monthnav{display:flex;align-items:center;gap:4px}
  .icon-btn{
    display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer
  }
  .icon-btn:active{transform:scale(.94)}
  .month-label{font-weight:600;font-size:13.5px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}

  .stack{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .card-h h2{font-size:15px}
  .card-h .link{font-size:13px;font-weight:600;color:var(--accent);background:0;border:0;cursor:pointer;padding:0}

  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}

  .balance-hero{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;display:flex;flex-direction:column;gap:2px
  }
  .balance-hero .big{
    font-family:var(--font-display);font-size:34px;font-weight:500;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px
  }
  .flowrow{display:flex;gap:10px;margin-top:14px}
  .flowbox{flex:1;background:var(--surface-2);border-radius:11px;padding:10px 12px}
  .flowbox .k{font-size:11.5px;color:var(--ink-2);font-weight:600}
  .flowbox .v{font-family:var(--font-mono);font-size:14px;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}

  .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  .progress{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:4px}
  .progress > span{display:block;height:100%;border-radius:6px}
  .bud-row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--ink-2)}
  .bud-row b{color:var(--ink);font-weight:600}

  .segbar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
  .legend{display:flex;flex-direction:column;gap:9px;margin-top:13px}
  .legend .li{display:flex;align-items:center;gap:9px;font-size:13.5px}
  .dot{width:9px;height:9px;border-radius:3px;flex:none}
  .legend .li .amt{margin-left:auto;font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}

  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .list .row:first-child{padding-top:2px}
  .avatar{
    width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    color:#fff;font-weight:600;font-size:13px;letter-spacing:.02em
  }
  .row .main{min-width:0;flex:1}
  .row .main .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .main .s{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .end{text-align:right;flex:none}
  .row .end .a{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
  .row .end .s{font-size:11.5px;color:var(--ink-3)}
  .row.tap{cursor:pointer}
  .row.tap:active{background:var(--surface-2);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}

  .date-head{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;padding:16px 0 2px}

  .chips{display:flex;gap:8px;margin:2px 0 6px}
  .chip{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer
  }
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

  .search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:4px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
  .filters select{flex:1 1 46%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px}

  .empty{text-align:center;color:var(--ink-3);padding:34px 16px;font-size:14px}

  .btn{
    font:inherit;font-weight:600;font-size:14.5px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);padding:12px 15px;border-radius:11px;cursor:pointer
  }
  .btn:active{transform:scale(.985)}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn-danger{color:var(--neg);border-color:transparent;background:transparent}
  .btn-block{width:100%;display:block}
  .btn-row{display:flex;gap:10px}
  .btn-row .btn{flex:1}

  .tabbar{
    position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:460px;z-index:30;
    background:var(--surface);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);
    padding-bottom:env(safe-area-inset-bottom)
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:0;border:0;padding:9px 0 10px;color:var(--ink-3);font-size:10.5px;font-weight:600;cursor:pointer
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-current="page"]{color:var(--accent)}

  .fab-wrap{
    position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));
    margin:0 auto;max-width:460px;z-index:31;display:flex;justify-content:flex-end;
    padding:0 16px;pointer-events:none
  }
  .fab{
    pointer-events:auto;width:54px;height:54px;border-radius:17px;border:0;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;
    box-shadow:var(--shadow);display:grid;place-items:center;padding-bottom:3px
  }
  .fab:active{transform:scale(.93)}

  /* sheet / modal */
  #modal[hidden]{display:none}
  .scrim{position:fixed;inset:0;background:rgba(12,18,14,.5);z-index:40;animation:fade .18s ease}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;z-index:41;
    background:var(--ground);border-radius:20px 20px 0 0;max-height:92dvh;
    display:flex;flex-direction:column;animation:slideup .24s cubic-bezier(.2,.8,.2,1)
  }
  .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
  .sheet-h h2{font-size:17px}
  .sheet-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  .close-x{width:32px;height:32px;border-radius:9px;border:0;background:var(--surface-2);color:var(--ink-2);font-size:15px;cursor:pointer}

  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field > label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
  .field input,.field select,.field textarea{
    font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--ink);width:100%
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chart svg{display:block;width:100%;height:auto}
  .chart2{display:flex;align-items:flex-start;gap:0}
  .chart2 .chaxis{flex:none;display:block}
  .chscroll{overflow-x:auto;overflow-y:hidden;flex:1;-webkit-overflow-scrolling:touch}
  .chscroll::-webkit-scrollbar{height:3px}
  .chscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .chscroll svg{display:block}
  .chleg{display:flex;gap:16px;margin-bottom:10px;font-size:12px;color:var(--ink-2)}
  .chleg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .blrow{padding:7px 0}
  .bltop{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
  .bln{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .blv{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;flex:none}
  .bltrack{height:8px;background:var(--surface-2);border-radius:4px}
  .bltrack span{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
  .chk{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);margin:6px 0 10px;cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}

  .seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px}
  .seg button{flex:1;border:0;background:0;padding:9px;border-radius:9px;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .seg.five button{font-size:13px;padding:9px 2px}
  /* ---- qulf ekrani ---- */
  #lockscreen{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;
    flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
  #lockscreen[hidden]{display:none}
  .lk-title{font-family:var(--font-display);font-size:22px;font-weight:500;text-align:center}
  .lk-sub{color:var(--ink-2);font-size:13px;text-align:center;min-height:19px}
  .lk-sub.bad{color:var(--neg)}
  .lk-dots{display:flex;gap:11px;height:14px;align-items:center}
  .lk-dots i{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--ink-3);display:block}
  .lk-dots i.on{background:var(--accent);border-color:var(--accent)}
  .lk-pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px;justify-content:center}
  .lk-pad button{height:62px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);font:inherit;font-size:22px;font-family:var(--font-mono);cursor:pointer}
  .lk-pad button.wide{font-size:15px;font-family:inherit}
  .lk-pad button:disabled{opacity:.35}
  .lk-grid{touch-action:none;width:252px;height:252px}
  .lk-grid circle.d{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.6}
  .lk-grid circle.d.on{fill:var(--accent);stroke:var(--accent)}
  .lk-grid path{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .lk-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .bill-line{border-top:1px solid var(--line);padding:9px 0}
  .bill-list .bill-line:first-child{border-top:0}
  .bill-top{display:flex;gap:7px;align-items:center}
  .bill-top input{font:inherit;font-size:13px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
  .bill-top .bname{flex:1 1 auto;min-width:0;width:auto}
  .bill-top .bamt{flex:0 0 96px;width:96px;text-align:right;font-family:var(--font-mono)}
  .bill-x{border:0;background:0;color:var(--ink-3);font-size:20px;line-height:1;padding:2px 2px;cursor:pointer;flex:none}
  .bill-who{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .bill-who button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  .bill-who button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .bill-who .all{font-style:italic;color:var(--ink-3)}
  .bill-foot{display:flex;gap:9px;align-items:center;margin-top:12px}
  .bill-foot label{flex:1;font-size:12px;color:var(--ink-2)}
  .bill-foot input{flex:0 0 76px;width:76px;font:inherit;font-size:13px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);text-align:right}

  .split-list{display:flex;flex-direction:column;gap:9px}
  .split-line{display:flex;align-items:center;gap:9px}
  .split-line .nm{flex:1;min-width:0;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .split-line .sinput{width:104px;flex:none}
  .split-line .xinput{width:92px;flex:none;font-size:13px}
  .split-line .calc{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);min-width:78px;flex:none;text-align:right}
  .split-line input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
  .split-line .pcs{color:var(--ink-3);font-size:13px;margin-left:-4px}
  .calcpad{display:flex;gap:6px;margin-top:6px}
  .calcpad .ckey{flex:1;padding:9px 0;font-size:17px;line-height:1;border:1px solid var(--line);
    border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:var(--font-mono);cursor:pointer}
  .calcpad .ckey:active{background:var(--line)}
  .calcline{margin-top:5px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
  .split-status{font-size:12.5px;color:var(--ink-2);padding-top:4px;line-height:1.4}
  .split-status.bad{color:var(--neg)}
  .split-status.warn{color:var(--warn)}

  .settle-line{
    display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)
  }
  .settle-line:last-child{border-bottom:0}
  .settle-line.tap{cursor:pointer}
  .settle-line.tap:active{background:var(--surface-2)}
  .settle-line .txt{flex:1;font-size:13.5px}
  .settle-line .txt b{font-weight:600}
  .settle-line .amt{font-family:var(--font-mono);font-weight:500}
  .mini-btn{border:1px solid var(--accent);background:0;color:var(--accent);font-weight:600;font-size:12px;padding:6px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}

  .note{font-size:12.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:10px;padding:10px 12px}

  .view-amt{font-family:var(--font-display);font-size:30px;font-weight:500;text-align:center;padding:2px 0 6px;font-variant-numeric:tabular-nums}
  .view-meta{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13.5px}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--ink-2)}
  .kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
  .view-receipt{width:100%;max-height:240px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
  .view-split{display:flex;flex-direction:column;gap:2px}
  .sample-tag{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:3px 9px
  }

  textarea.io{width:100%;min-height:140px;font-family:var(--font-mono);font-size:12px}

  .rc{display:flex;flex-direction:column;gap:8px}
  .rc img{width:100%;max-height:220px;object-fit:cover;border-radius:11px;border:1px solid var(--line);cursor:zoom-in}
  .avatar.rcimg{padding:0;overflow:hidden;background:var(--surface-2)}
  .avatar.rcimg img{width:100%;height:100%;object-fit:cover}

  #lightbox[hidden]{display:none}
  #lightbox{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:22px}
  #lightbox .lb-bg{position:fixed;inset:0;background:rgba(0,0,0,.86)}
  #lightbox img{position:relative;max-width:100%;max-height:100%;border-radius:12px}

  @keyframes fade{from{opacity:0}}
  @keyframes slideup{from{transform:translateY(100%)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .fab:active,.btn:active,.icon-btn:active,.row.tap:active{transform:none}
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<div class="app">

  "Bu faqat shaxsiy hamyoningiz (hisoblar, kategoriyalar, amaliyotlar). Guruhlar bulutda — boshqa telefonda o‘sha taklif havolasi bilan kirasiz.":["Это только ваш личный кошелёк (счета, категории, операции). Группы в облаке — на другом телефоне входите по той же ссылке-приглашению.","This is only your personal wallet (accounts, categories, transactions). Groups live in the cloud — on another phone use the same invite link."],

  "qoldiqsiz sotilgan — unga tannarx yozilmagan, foyda shuncha yuqori ko‘rinadi. Yetishmagan prihodni kiriting.":["продано без остатка — себестоимость не учтена, прибыль выглядит выше. Внесите недостающий приход.","sold without stock — no cost was recorded, so profit looks higher. Enter the missing stock-in."],
  "Hozirgi bo‘linish. O‘zgartirish uchun biror a‘zoning summasini yozing — qolgani boshqalarga teng bo‘linadi.":["Текущее разделение. Чтобы изменить, впишите сумму участнику — остальное разделится поровну.","Current split. To change it, type an amount for a member — the rest is split evenly."],
  "«Eng kam qoldiq» — shu chegaraga tushganda ogohlantirish chiqadi. Kerak bo‘lmasa bo‘sh qoldiring.":["«Мин. остаток» — при падении до этого уровня появится предупреждение. Не нужно — оставьте пустым.","“Min. stock” — a warning appears when the quantity drops to it. Leave empty if not needed."],

var LANGS = [['uz','O‘zbek'], ['ru','Русский'], ['en','English']];
function lang(){
  var l = (state.settings && state.settings.lang) || 'uz';
  return (l==='ru' || l==='en') ? l : 'uz';
}
/* harf hisoblanadigan belgilar — kalit so‘z o‘rtasida almashmasligi uchun */
var TR_W = '0-9A-Za-zЀ-ӿ‘’';
var _trRe = null;
function trRe(){
  if(_trRe) return _trRe;
  var keys = [];
  for(var k in I18N){ if(I18N.hasOwnProperty(k)) keys.push(k); }
  keys.sort(function(a,b){ return b.length - a.length; });   /* uzunidan boshlab */
  var alts = keys.map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
  _trRe = new RegExp('(^|[^'+TR_W+'])('+alts+')(?![' + TR_W + '])', 'g');
  return _trRe;
}
/* faqat ko‘rinadigan matnni almashtiramiz */
function trText(s, ix){
  return String(s).replace(trRe(), function(m, pre, key){
    var v = I18N[key];
    return pre + ((v && v[ix]) || key);
  });
}
/* Teg ichidagi qiymatlar (value, data-*, class…) TARJIMA QILINMAYDI —
   aks holda saqlanadigan ma‘lumot buziladi (masalan value="dona").
   Faqat foydalanuvchi ko‘radigan atributlar tarjima qilinadi. */
var TR_ATTR = /\s(placeholder|aria-label|title|alt)="([^"]*)"/g;
function tr(s){
  if(s==null || s==='') return s;
  var L = lang();
  if(L==='uz') return s;
  var ix = (L==='ru') ? 0 : 1;
  return String(s).replace(/<[^>]*>|[^<]+/g, function(ch){
    if(ch.charAt(0) !== '<') return trText(ch, ix);
    return ch.replace(TR_ATTR, function(m, a, v){
      return ' ' + a + '="' + trText(v, ix) + '"';
    });
  });
}
/* alert/confirm/prompt ham tarjima bo‘lsin — chaqiruv joylarini o‘zgartirmaymiz */
var _alert = window.alert, _confirm = window.confirm, _prompt = window.prompt;
function alert(m){ return _alert.call(window, tr(m)); }
function confirm(m){ return _confirm.call(window, tr(m)); }
function prompt(m, d){ return _prompt.call(window, tr(m), d); }

        ? ('<button class="btn btn-block" data-act="lock-set">Kodni o‘zgartirish</button>'

        : '<button class="btn btn-primary btn-block" data-act="lock-set">Qulf qo‘yish</button>')
    + '</div>';
}
/* Kod qo‘yish: avval turini tanlaymiz, keyin ikki marta kiritamiz */
function openLockSet(){
  var body = '<div class="note" style="margin-bottom:12px">Kod faqat shu telefonda saqlanadi — '
    + 'ma‘lumotni ko‘chirganda u ko‘chmaydi. Unutib qo‘ysangiz, qulfni ilovani '
    + 'qaytadan o‘rnatib yechasiz, shuning uchun eslab qoladiganini tanlang.</div>'
    + '<div class="lk-row"><button class="btn btn-primary" type="button" data-lk="pin">PIN kod</button>'
    + '<button class="btn btn-primary" type="button" data-lk="pattern">Grafik kalit</button></div>';
  openModal('Qulf qo‘yish', body, {
    onMount:function(root){
      root.querySelectorAll('[data-lk]').forEach(function(b){
        b.addEventListener('click', function(){ openLockEnter(b.dataset.lk); });
      });
    }
  });
}
function openLockEnter(kind){
  var first = null;
  var body = '<div class="lk-sub" id="lkmsg" style="margin-bottom:12px"></div>'
    + (kind==='pin' ? '<div style="display:flex;justify-content:center;margin-bottom:12px">'+lockDotsHtml(0)+'</div>'+lockPadHtml('OK')
                    : '<div style="display:flex;justify-content:center">'+lockGridHtml()+'</div>');
  openModal(kind==='pin' ? 'PIN kod' : 'Grafik kalit', body, {
    onMount:function(root){
      var pin = '', msg = root.querySelector('#lkmsg');
      var say = function(t, bad){ msg.textContent = tr(t); msg.className = 'lk-sub'+(bad?' bad':''); };
      var dots = function(){
        var d = root.querySelector('.lk-dots');
        if(d) d.innerHTML = lockDotsHtml(pin.length).replace(/^<div[^>]*>|<\/div>$/g,'');
      };
      var take = function(v){
        if(!first){
          first = v;
          pin = ''; dots();
          say(kind==='pin' ? 'Yana bir marta kiriting' : 'Yana bir marta chizing');
          return;
        }
        if(v !== first){
          first = null; pin = ''; dots();
          say(kind==='pin' ? 'Mos kelmadi — boshidan' : 'Mos kelmadi — boshidan', true);
          return;
        }
        var salt = lockSalt();
        lockHash(v, salt, function(h){
          var old = lockCfg() || {};
          lockSave({kind:kind, salt:salt, hash:h, len:(kind==='pin'?v.length:0),
                    bio:!!(old.bio && old.credId), credId:old.credId||null});
          closeModal();
          alert('Qulf qo‘yildi. Endi ilova ochilganda kod so‘raladi.');
          render();
        });
      };
      say(kind==='pin' ? '4–6 raqamli kod o‘ylab toping' : 'Kamida 4 nuqtani bog‘lang');
      if(kind==='pin'){
        root.querySelectorAll('.lk-pad button').forEach(function(b){
          b.addEventListener('click', function(){
            var k = b.dataset.k;
            if(k==='del'){ pin = pin.slice(0,-1); dots(); return; }
            if(k==='ok'){ if(pin.length>=4) take(pin); else say('Kamida 4 raqam', true); return; }
            if(pin.length>=6) return;
            pin += k; dots();
          });
        });
      }else{
        wireGrid(root, function(v){
          if(v && v.split('-').length >= 4) take(v);
          else if(v) say('Kamida 4 nuqta kerak', true);
        });
      }
    }
  });
}
function toggleLockBio(){
  var c = lockCfg();
  if(!c || !c.kind){ alert('Avval PIN kod yoki grafik kalit qo‘ying.'); return; }
  if(c.bio && c.credId){
    c.bio = false; c.credId = null; lockSave(c); render();
    alert('Barmoq izi o‘chirildi. Endi faqat kod so‘raladi.');
    return;
  }
  bioMaybe(function(ok){
    if(!ok){
      alert('Bu telefon yoki brauzer barmoq izi / Face ID ni bermayapti.\n\nAndroidda Chrome, iPhone‘da Safari orqali oching va telefonda barmoq izi yoqilgan bo‘lsin.');
      return;
    }
    bioEnroll(function(id){
      if(!id){ alert('Bog‘lab bo‘lmadi — qaytadan urinib ko‘ring.'); return; }
      c.bio = true; c.credId = id; lockSave(c); render();
      alert('Tayyor. Endi ilova ochilganda barmoq izi so‘raladi, kod esa zaxira bo‘lib qoladi.');
    });
  });
}
function langCard(){
  var cur = lang();
  return '<div class="card"><div class="card-h"><h2>Til · Язык · Language</h2></div>'
    + '<div class="chips" style="padding-bottom:0">'
    + LANGS.map(function(x){
        return '<button class="chip" data-act="set-lang" data-l="'+x[0]+'" aria-pressed="'+(x[0]===cur)+'">'+x[1]+'</button>';
      }).join('')
    + '</div></div>';
}

/* ---------- kichik kalkulyator ----------
   Summa va miqdor maydonlariga «3*45000+500» kabi ifoda yozsa bo‘ladi.
   eval() ishlatilmaydi — o‘z tahlilchimiz, faqat raqam va amallarni tushunadi. */
function isPlainNum(v){ return /^-?[\d.,\s\u00A0]*$/.test(String(v==null?'':v)); }
function calcEval(src){
  var s = String(src==null?'':src)
    .replace(/[\u00A0\s]/g,'')
    .replace(/[×xX]/g,'*').replace(/[÷:]/g,'/')
    .replace(/,/g,'.');
  if(s==='' || !/^[0-9.+\-*/()]+$/.test(s)) return null;
  var i=0;
  var peek=function(){ return s.charAt(i); };
  var num=function(){
    var st=i;
    while(i<s.length && /[0-9.]/.test(s.charAt(i))) i++;
    if(i===st) return NaN;
    var v=parseFloat(s.slice(st,i));
    return isFinite(v) ? v : NaN;
  };
  var expr;
  var factor=function(){
    var c=peek();
    if(c==='+'){ i++; return factor(); }
    if(c==='-'){ i++; var f=factor(); return isNaN(f) ? NaN : -f; }
    if(c==='('){ i++; var v=expr(); if(peek()!==')') return NaN; i++; return v; }
    return num();
  };
  var term=function(){
    var v=factor();
    while(!isNaN(v) && (peek()==='*' || peek()==='/')){
      var op=peek(); i++;
      var r=factor();
      if(isNaN(r)) return NaN;
      if(op==='*') v=v*r;
      else { if(r===0) return NaN; v=v/r; }
    }
    return v;
  };
  expr=function(){
    var v=term();
    while(!isNaN(v) && (peek()==='+' || peek()==='-')){
      var op=peek(); i++;
      var r=term();
      if(isNaN(r)) return NaN;
      v = (op==='+') ? v+r : v-r;
    }
    return v;
  };
  var out=expr();
  if(i!==s.length || isNaN(out) || !isFinite(out)) return null;
  return out;
}
/* ifoda bo‘lsa hisoblangan sonni, aks holda null */
function calcOf(v){ return isPlainNum(v) ? null : calcEval(v); }

function parseAmount(v){
  var c=calcOf(v); if(c!==null) return Math.round(c);
  var n=parseFloat(String(v).replace(/[^\d.\-]/g,'')); return isFinite(n)?Math.round(n):0;
}

function compressImage(file, cb){

    img.onload=function(){
      var max=1400, sc=Math.min(1, max/Math.max(img.width,img.height));
      var w=Math.round(img.width*sc), hh=Math.round(img.height*sc);
      var cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      URL.revokeObjectURL(url);

/* ---------- split math ---------- */
function splitEqual(amount, ids){
  var n=ids.length; if(!n) return [];
  var base=Math.floor(amount/n), rem=amount-base*n;
  return ids.map(function(id,i){ return {memberId:id, share: base + (i<rem?1:0)}; });
}
/* Foizni ko‘rsatish: 27,5 → "27,5", 30 → "30" */
function fmtPct(n){ return String(Math.round(n*100)/100).replace('.',','); }
/* "Teng" rejimi + shaxsiy qo‘shimcha.
   Avval kimning nimasi o‘ziniki bo‘lsa (extra) ayriladi, QOLGANI
   belgilangan a‘zolar orasida teng bo‘linadi. Masalan 69 000 dan
   7 000 Izzatniki bo‘lsa, qolgan 62 000 ikkiga bo‘linadi va
   Izzatga 38 000, SHO ga 31 000 chiqadi. */
function splitEqualPlus(amount, ids, extra, allIds){
  extra = extra || {}; allIds = allIds || ids;
  var own=0, map={};
  allIds.forEach(function(id){ var v=(extra[id]>0?extra[id]:0); if(v>0){ map[id]=v; own+=v; } });
  var rest=amount-own; if(rest<0) rest=0;
  if(ids.length) splitEqual(rest, ids).forEach(function(x){ map[x.memberId]=(map[x.memberId]||0)+x.share; });
  var rows=allIds.filter(function(id){ return map[id]>0; }).map(function(id){ return {memberId:id, share:map[id]}; });
  return {rows:rows, map:map, own:own, rest:rest,
          each: ids.length ? Math.round(rest/ids.length) : 0};
}
function splitWeighted(amount, pairs){
  var total=pairs.reduce(function(s,p){return s+p.w;},0);
  if(total<=0) return [];
  var out=pairs.map(function(p){ var raw=amount*p.w/total; return {memberId:p.id, share:Math.floor(raw), frac:raw-Math.floor(raw)}; });
  var dist=out.reduce(function(s,o){return s+o.share;},0), rem=amount-dist;
  out.map(function(o,i){return {i:i,frac:o.frac};}).sort(function(a,b){return b.frac-a.frac;}).slice(0,rem).forEach(function(x){ out[x.i].share++; });
  return out.map(function(o){ return {memberId:o.memberId, share:o.share}; });
}
/* "Foiz" rejimi: har kimga % yoziladi. Foizlar yig‘indisi 100 dan kam
   bo‘lsa, qolgani bo‘linmaydi — u to‘lovchida qoladi. */
function splitPct(amount, pairs){
  var tot=0;
  pairs.forEach(function(x){ if(x.p>0) tot+=x.p; });
  /* 27,5 kabi kasr foizlar uchun: float qoldig‘ini olib tashlaymiz,
     aks holda 27,5+30+27,5+15 ham 100 ga teng chiqmay qolishi mumkin */
  tot=Math.round(tot*1000)/1000;
  if(tot<=0) return {rows:[], totalPct:0, used:0};
  var used=Math.round(amount*tot/100);
  var rows=splitWeighted(used, pairs.map(function(x){ return {id:x.id, w:(x.p>0?x.p:0)}; }));
  return {rows:rows, totalPct:tot, used:used};
}
/* "Chek" rejimi: har bir taom (qator) o‘z narxi bilan, yonida kim yegani.
   Qatorda hech kim belgilanmagan bo‘lsa — hammaga teng tegadi.
   Xizmat haqi (%) hamma qatorga nisbatan qo‘shiladi. */
function splitBill(lines, svc, allIds){
  var sum = 0, raw = {};
  allIds.forEach(function(id){ raw[id] = 0; });
  (lines||[]).forEach(function(l){
    var a = (l && l.amt > 0) ? l.amt : 0;
    if(a <= 0) return;
    sum += a;
    var who = allIds.filter(function(id){ return l.who && l.who[id]; });
    if(!who.length) who = allIds.slice();
    who.forEach(function(id){ raw[id] += a / who.length; });
  });
  var total = Math.round(sum * (1 + ((svc > 0 ? svc : 0) / 100)));
  var pairs = allIds.filter(function(id){ return raw[id] > 0; })
                    .map(function(id){ return {id:id, w:raw[id]}; });
  /* splitWeighted nisbatni saqlab butun songa bo‘ladi — xizmat haqi
     ham shu nisbatda tarqaladi, tiyin yo‘qolmaydi */
  return {rows: pairs.length ? splitWeighted(total, pairs) : [], total:total, sum:sum, raw:raw};
}
// "Aniq" rejim: ba'zi a'zolar summasi qo'lda kiritiladi (raw[id] bo'sh emas),
// qolgan summa bo'sh qolganlar orasida teng bo'linadi.
function exactShares(total, raw, ids){
  var fixed={}, fixedSum=0, autoIds=[];
  ids.forEach(function(id){
    var s=(raw[id]==null?'':String(raw[id])).trim();
    if(s===''){ autoIds.push(id); }
    else { var v=parseAmount(s); fixed[id]=v; fixedSum+=v; }
  });
  var shares={};
  ids.forEach(function(id){ shares[id]=fixed[id]||0; });
  var remainder=total-fixedSum;
  if(autoIds.length){
    splitEqual(remainder>0?remainder:0, autoIds).forEach(function(s){ shares[s.memberId]=s.share; });
  }
  return {shares:shares, fixedSum:fixedSum, autoIds:autoIds, remainder:remainder};
}

/* ---------- group balances ---------- */
function entryType(e){ return e.type==='income' ? 'income' : 'expense'; }
/* «Nima uchun» majburiy emas — bo‘sh bo‘lsa kategoriya nomi,
   u ham bo‘lmasa shunchaki turi ko‘rinadi (ekranda bo‘shliq qolmasin) */
function entryTitle(e){
  var t = (e && e.title || '').trim();
  if(t) return t;
  var c = (e && e.categoryName) || (cat(e && e.categoryId)||{}).name || '';
  if(c) return c;
  return entryType(e)==='income' ? 'Tushum' : 'Chiqim';
}
function computeBalances(g){
  var net={}; g.members.forEach(function(m){ net[m.id]=0; });
  g.expenses.forEach(function(e){
    var k = entryType(e)==='income' ? -1 : 1;   // tushum = teskari
    net[e.paidBy]=(net[e.paidBy]||0)+k*e.amount;
    (e.splits||[]).forEach(function(s){ net[s.memberId]=(net[s.memberId]||0)-k*s.share; });
  });
  (g.settlements||[]).forEach(function(s){
    net[s.from]=(net[s.from]||0)+s.amount;
    net[s.to]=(net[s.to]||0)-s.amount;
  });
  return net;
}
function simplify(net){
  var cred=[],deb=[];
  Object.keys(net).forEach(function(id){
    var v=Math.round(net[id]);
    if(v>1) cred.push({id:id,amt:v});
    else if(v<-1) deb.push({id:id,amt:-v});
  });
  cred.sort(function(a,b){return b.amt-a.amt;});
  deb.sort(function(a,b){return b.amt-a.amt;});
  var res=[],i=0,j=0;
  while(i<deb.length && j<cred.length){
    var pay=Math.min(deb[i].amt,cred[j].amt);
    res.push({from:deb[i].id,to:cred[j].id,amount:pay});
    deb[i].amt-=pay; cred[j].amt-=pay;
    if(deb[i].amt<=0) i++;
    if(cred[j].amt<=0) j++;
  }
  return res;
}

/* p — davr: '2026-11' (oy), '2026' (yil) yoki {from:'...', to:'...'} (tanlangan sanalar) */
function inPeriod(d, p){
  d = d || '';
  if(!d) return false;
  if(typeof p === 'string') return d.slice(0, p.length) === p;
  return (!p.from || d >= p.from) && (!p.to || d <= p.to);
}
function groupMonthShares(p){
  var r={inc:0, exp:0, byCat:{}};
  state.groups.forEach(function(g){
    (g.expenses||[]).forEach(function(e){
      if(!inPeriod(e.date, p)) return;
      var sh=myShareIn(g,e); if(sh<=0) return;
      if(entryType(e)==='income') r.inc+=sh;
      else { r.exp+=sh; var cid=entryCatId(e); r.byCat[cid]=(r.byCat[cid]||0)+sh; }
    });
  });
  return r;
}

function cloudOn(){ return !!(SB && SB_UID); }
function cloudSetupMsg(){ return 'Bulut hali sozlanmagan. config.js faylini Supabase ma‘lumoti bilan to‘ldiring (SETUP.md ga qarang).'; }
function myMember(g){ return (g.members||[]).filter(function(m){ return m.user_id && m.user_id===SB_UID; })[0]; }
function meId(g){ var m=myMember(g); return m ? m.id : '__me__'; }
function myRole(g){ var m=myMember(g); return m ? m.role : 'viewer'; }
function canEdit(g){ var r=myRole(g); return r==='owner'||r==='editor'; }
function isOwner(g){ return myRole(g)==='owner'; }
/* ombor ko‘rish huquqi: egasi va tahrirlovchi doim ko‘radi,
   «faqat ko‘radi» roli esa guruh egasi ruxsat bergandagina (members.can_stock) */
function canSeeStock(g){
  if(!g) return true;
  if(canEdit(g)) return true;
  /* bulut uzilgan bo‘lsa SB_UID yo‘q — o‘sha paytda guruhdagi o‘z qatorimizga qaraymiz.
     Kim ekanimiz umuman aniq bo‘lmasa keshni to‘smaymiz: asl himoya baribir RLS da */
  var m = myMember(g) || (g.members||[]).filter(function(x){ return x.id===g.meMemberId; })[0];
  return !m || m.can_stock===true;
}
function roleLabel(r){ return r==='owner'?'Egasi':r==='viewer'?'Faqat ko‘radi':'Tahrirlaydi'; }
function randToken(){ return (uid()+uid()+uid()+uid()).slice(0,24); }

function sbFail(e){
  var msg=(e&&(e.message||e.error_description||e.msg))||'';
  if(/row-level security|permission denied|violates|not.*allowed/i.test(msg)) alert('Sizda bu amalni bajarish huquqi yo‘q.');
  else alert('Bulut xatosi — internet aloqasini tekshiring.'+(msg?('\n'+msg):''));
  console.error(e);
}
function rowToEntry(r){
  return { id:r.id, type:r.type||'expense', title:r.title, amount:Number(r.amount)||0,
    categoryName:r.category||'', paidBy:r.paid_by, date:r.occurred_on,
    splits:(r.splits||[]).map(function(s){ return {memberId:s.member_id, share:Number(s.share)||0}; }),
    receipt:r.receipt||null, createdAt:r.created_at, createdBy:r.created_by,
    updatedAt:r.updated_at, updatedBy:r.updated_by };
}
function entryToRow(g, d){
  var rc=d.receipt||null; if(rc && rc.length>250000) rc=null;
  return { group_id:g.id, type:entryType(d), title:d.title, amount:d.amount,
    category:d.categoryName||null, paid_by:d.paidBy||null, occurred_on:d.date,
    splits:(d.splits||[]).map(function(s){ return {member_id:s.memberId, share:s.share}; }),
    receipt:rc, created_by:SB_UID };
}
function rowToSettlement(r){ return { id:r.id, from:r.from_member, to:r.to_member, amount:Number(r.amount)||0, date:r.occurred_on }; }

/* Ombor jadvallari serverda bormi. Agar foydalanuvchi yangilangan schema.sql ni
   hali ishga tushirmagan bo‘lsa, so‘rovni ularsiz qaytaramiz — aks holda
   butun guruhlar ishlamay qolardi. */
var sbHasStock = true;
/* guruh zametkalari jadvali — eski serverda bo‘lmasligi mumkin */
var sbHasNotes = true;
function loadGroups(){
  if(!cloudOn()) return Promise.resolve();
  var sel = '*, members(*), entries(*), settlements(*)'
    + (sbHasStock ? ', stock_items(*), stock_moves(*)' : '')
    + (sbHasNotes ? ', group_notes(*)' : '');
  return SB.from('groups').select(sel).then(function(res){
    var em = (res.error && res.error.message) || '';
    /* eski sxemada jadval yo‘q bo‘lsa butun so‘rov yiqiladi (PGRST200) —
       aybdorini aniqlab, usiz qayta so‘raymiz */
    if(res.error && sbHasNotes && /group_notes/i.test(em)){
      sbHasNotes = false; return loadGroups();
    }
    if(res.error && sbHasStock && /stock_items|stock_moves|relationship|schema cache/i.test(em)){
      sbHasStock = false;                 /* eski sxema — omborsiz davom etamiz */
      return loadGroups();
    }
    if(res.error){ cloudErr='load'; console.error(res.error); render(); return; }
    cloudErr=null;
    state.groups = (res.data||[]).map(function(row){
      return {
        id:row.id, name:row.name, currency:row.currency||'UZS', createdBy:row.created_by,
        members:(row.members||[]).map(function(m){ return {id:m.id,name:m.name,user_id:m.user_id,role:m.role,claim_token:m.claim_token}; }),
        expenses:(row.entries||[]).map(rowToEntry),
        settlements:(row.settlements||[]).map(rowToSettlement),
        items:(row.stock_items||[]).map(function(x){
          return {id:x.id, name:x.name, unit:x.unit||'dona', min:Number(x.min_qty)||0, cat:x.cat||''};
        }),
        notes:(row.group_notes||[]).map(function(x){
          return {id:x.id, body:x.body||'', createdAt:x.created_at, createdBy:x.created_by,
                  updatedAt:x.updated_at, updatedBy:x.updated_by};
        }).sort(function(a,b){ return (a.createdAt||'')<(b.createdAt||'') ? 1 : -1; }),
        stock:(row.stock_moves||[]).map(function(x){
          return {id:x.id, itemId:x.item_id, type:(x.type==='out'?'out':'in'),
                  qty:Number(x.qty)||0, price:Number(x.price)||0,
                  date:x.occurred_on, note:x.note||'', party:x.party||'', txId:null,
                  createdAt:x.created_at, createdBy:x.created_by,
                  updatedAt:x.updated_at, updatedBy:x.updated_by};
        })
      };
    }).sort(function(a,b){ return (a.name||'')<(b.name||'')?-1:1; });
    try{ localStorage.setItem('birga_groups_cache', JSON.stringify(state.groups)); }catch(e){}
    render();
  });
}
var reloadT=null;
function scheduleReload(){ clearTimeout(reloadT); reloadT=setTimeout(loadGroups, 300); }
function subscribeCloud(){
  sbChannels.forEach(function(ch){ try{ SB.removeChannel(ch); }catch(e){} }); sbChannels=[];
  if(!cloudOn()) return;
  var ch=SB.channel('birga-live-'+SB_UID);
  ['groups','members','entries','settlements','stock_items','stock_moves'].forEach(function(t){
    ch.on('postgres_changes',{event:'*',schema:'public',table:t}, scheduleReload);
  });
  ch.subscribe();
  sbChannels.push(ch);
}

      return send({role:'editor'}).then(function(r2){
        if(r2.error) throw r2.error;
        alert(sqlNeeded('Ombor ruxsati alohida yozilmadi'));

function removeMember(g, memberId){
  var self = (memberId===meId(g));
  if(!self){
    if(!canEdit(g)){ alert('Sizda a‘zolarni boshqarish huquqi yo‘q — guruh egasidan so‘rang.'); return; }
    var m=(g.members||[]).filter(function(x){ return x.id===memberId; })[0];
    if(m && m.role==='owner' && !isOwner(g)){ alert('Guruh egasini faqat boshqa ega chiqara oladi.'); return; }
  }
  SB.from('members').delete().eq('id',memberId).then(function(r){
    if(r.error) throw r.error;
    return loadGroups();
  }).then(function(){
    var gg=grp(g.id);
    if(gg && (gg.members||[]).filter(function(x){ return x.id===memberId; }).length){
      alert(sqlNeeded(self?'Guruhdan chiqib bo‘lmadi':'A‘zoni chiqarib bo‘lmadi'));
    }
  }).catch(sbFail);
}

/* auth user id → guruhdagi ismi */
function memNameByUid(g, uid){
  if(!uid) return '';
  var m=(g.members||[]).filter(function(x){ return x.user_id===uid; })[0];
  return m ? m.name : 'nomaʼlum';

/* «26-noy 14:30» */
function fmtWhen(iso){
  if(!iso) return '';
  var d=new Date(iso);
  if(isNaN(d.getTime())) return '';
  var z=function(n){ return String(n).padStart(2,'0'); };
  return d.getDate()+'-'+UZMONTH_SHORT[d.getMonth()]+' '+z(d.getHours())+':'+z(d.getMinutes());
}
/* «Qo‘shdi: Aziz · 26-noy 14:30» va kerak bo‘lsa «O‘zgartirdi: …» */
function auditBlock(g, r){
  if(!g || !r) return '';
  var out='';
  var cw=fmtWhen(r.createdAt), cn=memNameByUid(g, r.createdBy);
  if(cw || cn) out += '<div class="kv"><span>Qo‘shdi</span><b>'+esc((cn||'—')+(cw?(' · '+cw):''))+'</b></div>';
  var uw=fmtWhen(r.updatedAt), un=memNameByUid(g, r.updatedBy);
  if(uw || r.updatedBy) out += '<div class="kv"><span>O‘zgartirdi</span><b>'+esc((un||'—')+(uw?(' · '+uw):''))+'</b></div>';
  return out;
}

      openModal('Guruhga qo‘shilish',

        +'<button class="btn btn-primary btn-block" type="button" data-act="do-claim" data-m="'+esc(memberId)+'" data-t="'+esc(token)+'">Qo‘shilish</button>', {});
    }).catch(sbFail);
  });
}

function commit(){ save(); render(); }

/* ---------- routing ---------- */
var route = { name:'home', ym: today().slice(0,7) };
function go(name, extra){
  route = Object.assign({name:name}, extra||{});
  if(name==='home' && !route.ym) route.ym = today().slice(0,7);
  window.scrollTo(0,0);
  render();
}

var screenEl = document.getElementById('screen');
var NAV_HTML = document.getElementById('tabbar').innerHTML;
var modalEl = document.getElementById('modal');
var fabWrap = document.getElementById('fabwrap');
var tabbar = document.getElementById('tabbar');

/* ---------- lookups ---------- */
function acc(id){ return state.accounts.filter(function(a){return a.id===id;})[0]; }
function cat(id){ return state.categories.filter(function(c){return c.id===id;})[0]; }
function grp(id){ return state.groups.filter(function(g){return g.id===id;})[0]; }
function memName(g,id){ var m=g.members.filter(function(x){return x.id===id;})[0]; return m?m.name:'?'; }
function accBalance(id){
  var b = (acc(id)||{opening:0}).opening||0;
  state.transactions.forEach(function(t){
    if(t.accountId!==id) return;
    if(t.type==='income') b+=t.amount; else if(t.type==='expense') b-=t.amount;
  });
  return b;
}
function monthTx(ym){
  return state.transactions.filter(function(t){ return t.date.slice(0,7)===ym; });
}
function meNetForGroup(g){ return computeBalances(g)[meId(g)]||0; }

/* ---------- render ---------- */
function render(){
  try{
    var map={home:'home',day:'home',tx:'tx',ombor:'ombor',items:'ombor',item:'ombor',moves:'ombor',groups:'groups',group:'groups',profil:'profil'};
    tabbar.innerHTML = tr(NAV_HTML);
    Array.prototype.forEach.call(tabbar.children, function(btn){
      btn.setAttribute('aria-current', btn.dataset.screen===map[route.name] ? 'page':'false');
    });
    /* yopiq guruh omborida qo‘shish tugmasi ham ko‘rinmasin */
    var lockedStock = (route.name==='ombor'||route.name==='items'||route.name==='item'||route.name==='moves') && !omborCanSee();
    fabWrap.hidden = (route.name==='profil') || lockedStock;
    var html='';
    if(route.name==='home') html=viewHome();
    else if(route.name==='tx') html=viewTx();
    else if(route.name==='groups') html=viewGroups();
    else if(route.name==='group') html=viewGroup();
    else if(route.name==='day') html=viewDay();
    else if(route.name==='ombor') html=viewOmbor();
    else if(route.name==='items') html=viewItems();
    else if(route.name==='item') html=viewItem();
    else if(route.name==='moves') html=viewMoves();
    else if(route.name==='profil') html=viewProfil();
    screenEl.innerHTML=tr(html);
    if(mountFns[route.name]) mountFns[route.name]();
    scrollChartToEnd();
  }catch(err){
    screenEl.innerHTML='<div class="empty">Xatolik: '+esc(err.message)+'</div>';
    console.error(err);
  }
}

/* kunlik grafik ochilganda oxiriga (bugunga) suriladi */
function scrollChartToEnd(){
  var el=document.getElementById('chscroll');
  if(el) el.scrollLeft = el.scrollWidth;
}

/* ---------- HOME ---------- */
function viewHome(){
  var ym=route.ym, tx=monthTx(ym);
  var gShare=groupMonthShares(ym);
  var inc=gShare.inc, exp=gShare.exp;
  tx.forEach(function(t){ if(t.type==='income') inc+=t.amount; else if(t.type==='expense') exp+=t.amount; });
  var net=inc-exp;

  // budget
  var bud=state.budget.monthly||0;
  var pct = bud>0 ? Math.min(exp/bud,1)*100 : 0;
  var over = bud>0 && exp>bud;
  var budColor = !bud ? 'var(--ink-3)' : over ? 'var(--neg)' : (exp/bud>0.85 ? 'var(--warn)' : 'var(--pos)');

  // category breakdown (shaxsiy + guruh ulushi)
  var byCat={};
  tx.forEach(function(t){ if(t.type!=='expense') return; byCat[t.categoryId]=(byCat[t.categoryId]||0)+t.amount; });
  Object.keys(gShare.byCat).forEach(function(cid){ byCat[cid]=(byCat[cid]||0)+gShare.byCat[cid]; });
  var rows=Object.keys(byCat).map(function(id){ return {id:id,amt:byCat[id]}; }).sort(function(a,b){return b.amt-a.amt;});
  var top=rows.slice(0,5);
  var restAmt=rows.slice(5).reduce(function(s,r){return s+r.amt;},0);
  var catSeg='', catLeg='';
  var totalExp=exp||1;
  top.forEach(function(r){
    var c=cat(r.id)||{name:'—'}, col=colorFor(r.id), p=(r.amt/totalExp*100);
    catSeg+='<span style="width:'+p.toFixed(1)+'%;background:'+col+'"></span>';
    catLeg+='<div class="li"><span class="dot" style="background:'+col+'"></span>'+esc(c.name)+'<span class="amt">'+fmtMoney(r.amt)+'</span></div>';
  });
  if(restAmt>0){
    var p=(restAmt/totalExp*100);
    catSeg+='<span style="width:'+p.toFixed(1)+'%;background:var(--ink-3)"></span>';
    catLeg+='<div class="li"><span class="dot" style="background:var(--ink-3)"></span>Boshqa<span class="amt">'+fmtMoney(restAmt)+'</span></div>';
  }

  // recent (shaxsiy + guruh)
  var recent=activityList().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;}).slice(0,5);

  var h='';
  h+='<div class="topbar"><div><h1>Asosiy</h1>'+(state.isSample?'<div class="sub"><span class="sample-tag">Namuna ma‘lumot</span></div>':'')+'</div>'
    +'<div class="monthnav">'
    +'<button class="icon-btn" data-act="month" data-d="-1" aria-label="Oldingi oy">‹</button>'
    +'<button class="month-label" data-act="pick-ym" style="background:0;border:0;color:inherit;font:inherit;cursor:pointer;padding:2px 4px">'+monthLabel(ym)+' ▾</button>'
    +'<button class="icon-btn" data-act="month" data-d="1" aria-label="Keyingi oy">›</button>'
    +'</div></div>';

  h+='<div class="stack">';

  h+=pulimCard();

  h+='<div class="balance-hero" style="margin-top:14px">'
    +'<span class="eyebrow">Bu oy sof natija</span>'
    +'<span class="big '+(net<0?'neg':net>0?'pos':'')+'">'+fmtMoney(net,true)+'</span>'
    +'<div class="flowrow">'
    +'<div class="flowbox"><div class="k">Kirim</div><div class="v pos">'+fmtMoney(inc)+'</div></div>'
    +'<div class="flowbox"><div class="k">Chiqim</div><div class="v neg">'+fmtMoney(exp)+'</div></div>'
    +'</div></div>';

  h += combinedCard(ym);

  var nMon = state.settings && state.settings.chartMonths ? state.settings.chartMonths : 6;
  var mch = nMon===1 ? dayChart(ym) : monthChart(ym, nMon);
  var chTitle = nMon===1 ? (monthLabel(ym)+' — kunlar') : ('Oxirgi '+nMon+' oy');
  if(mch) h+='<div class="card"><div class="card-h"><h2>'+esc(chTitle)+'</h2>'
    + '<span class="chips" style="padding:0;gap:5px">'
    + [1,3,6,12].map(function(n){
        return '<button class="chip" style="padding:4px 10px;font-size:12px" data-act="chmon" data-n="'+n+'" aria-pressed="'+(n===nMon)+'">'+n+'</button>';
      }).join('')
    + '</span></div>'+mch+'</div>';

  h+='<div class="card"><div class="card-h"><h2>Oylik byudjet</h2><button class="link" data-act="set-budget">Tahrirlash</button></div>'
    +(bud>0
      ? '<div class="progress"><span style="width:'+pct.toFixed(1)+'%;background:'+budColor+'"></span></div>'
        +'<div class="bud-row"><span>Sarflandi: <b>'+fmtMoney(exp)+'</b></span><span>'
        +(over?('<b class="neg">'+fmtMoney(exp-bud)+' oshib ketdi</b>'):('Qoldi: <b class="pos">'+fmtMoney(bud-exp)+'</b>'))
        +'</span></div>'
      : '<div class="empty" style="padding:14px 0">Byudjet belgilanmagan</div>')
    +'</div>';

  if(top.length){
    h+='<div class="card"><div class="card-h"><h2>Kategoriyalar bo‘yicha</h2></div>'
      +'<div class="segbar">'+catSeg+'</div><div class="legend">'+catLeg+'</div></div>';
  }

  h+='<div class="card"><div class="card-h"><h2>So‘nggi amaliyotlar</h2><button class="link" data-act="nav" data-screen="tx">Barchasi</button></div><div class="list">';
  if(!recent.length) h+='<div class="empty" style="padding:14px 0">Hali amaliyot yo‘q</div>';
  recent.forEach(function(r){ h+=actRow(r); });
  h+='</div></div>';

  h+='</div>';
  return h;
}
mountFns.home=function(){};

/* Asosiy ekrandagi birlashgan hisobot: ombor + guruh, pastida umumiy natija */
function repPeriod(){
  var v = (state.settings && state.settings.repPeriod) || 'month';
  if(v==='range' && !(state.settings.repFrom && state.settings.repTo)) return 'month';
  return (v==='year' || v==='range') ? v : 'month';
}
/* joriy davr: solishtirish uchun qiymat va ekranda ko‘rinadigan yorliq */
function repSel(ym){
  var per = repPeriod();
  if(per==='year'){ var yr=ym.slice(0,4); return {per:per, p:yr, label:'Yil '+yr}; }
  if(per==='range'){
    var f=state.settings.repFrom, t=state.settings.repTo;
    return {per:per, p:{from:f, to:t}, label:fmtDateLong(f)+' — '+fmtDateLong(t)};
  }
  return {per:'month', p:ym, label:monthLabel(ym)};
}
/* «Davr» — istalgan sanadan istalgan sanagacha */
function openRangeModal(){
  var st = state.settings || {};
  var f = st.repFrom || (today().slice(0,8)+'01'), t = st.repTo || today();
  var body = '<form novalidate>'
    + '<div class="note" style="margin-bottom:12px">Hisobot shu ikki sana orasidagi ma‘lumotni ko‘rsatadi. Ikkala kun ham hisobga kiradi.</div>'
    + '<div class="two">'
    + '<div class="field"><label>Boshlanishi</label><input type="date" name="from" value="'+esc(f)+'"></div>'
    + '<div class="field"><label>Tugashi</label><input type="date" name="to" value="'+esc(t)+'"></div>'
    + '</div>'
    + '<div style="height:10px"></div>'
    + '<button class="btn btn-primary btn-block" type="submit">Ko‘rsatish</button>'
    + '</form>';
  openModal('Davrni tanlash', body, {
    onSubmit:function(form){
      var a=form.from.value, b=form.to.value;
      if(!a || !b){ alert('Ikkala sanani ham tanlang.'); return; }
      if(a>b){ var w=a; a=b; b=w; }     /* teskari bersa — o‘rnini almashtiramiz */
      state.settings = state.settings || {};
      state.settings.repFrom = a;
      state.settings.repTo = b;
      state.settings.repPeriod = 'range';
      closeModal(); commit();
    }
  });
}
/* Ombordan tashqari pul harakati: shaxsiy kassadagi tushum va xarajat.
   «Kassaga ham yozilsin» orqali ombor harakatiga bog‘langanlari chiqarib
   tashlanadi — ular ombor qismida allaqachon hisoblangan, ikki marta
   sanalmasin. */
function cashOutside(p){
  var linked = {};
  state.stock.forEach(function(m){ if(m.txId) linked[m.txId]=1; });
  var inc=0, exp=0;
  state.transactions.forEach(function(t){
    if(!inPeriod(t.date, p)) return;
    if(linked[t.id]) return;
    if(t.type==='income') inc += t.amount;
    else if(t.type==='expense') exp += t.amount;
  });
  return {inc:inc, exp:exp, net:inc-exp, has:(inc>0 || exp>0)};
}
/* hamma hisoblardagi naqd pul */
function walletTotal(){
  return state.accounts.reduce(function(a,x){ return a + accBalance(x.id); }, 0);
}
/* «Pulim qancha» — bosh ekranning eng birinchi javobi.
   Naqd pul, ombordagi tovar va qarzlar bitta joyda. */
function pulimCard(){
  var cash  = walletTotal();
  var goods = omborCanSee() ? stockTotal() : 0;
  var owedToMe=0, iOwe=0;
  state.groups.forEach(function(g){ var n=meNetForGroup(g); if(n>0) owedToMe+=n; else iOwe+=-n; });
  var net = cash + goods + owedToMe - iOwe;
  var sgn = function(v){ return v<0 ? 'neg' : v>0 ? 'pos' : ''; };
  var rows = '';
  if(goods)     rows += '<div class="kv"><span>Ombordagi tovar</span><b>'+fmtMoney(goods)+'</b></div>';
  if(owedToMe)  rows += '<div class="kv"><span>Menga qaytariladi</span><b class="pos">'+fmtMoney(owedToMe)+'</b></div>';
  if(iOwe)      rows += '<div class="kv"><span>Men qaytaraman</span><b class="neg">'+fmtMoney(-iOwe,true)+'</b></div>';

  var h = '<div class="balance-hero" style="padding:14px 16px">'
        + '<span class="eyebrow">Pulim — naqd</span>'
        + '<span class="big '+sgn(cash)+'" style="font-size:27px">'+fmtMoney(cash)+'</span>'
        + '<div class="sub" style="color:var(--ink-2);font-size:12.5px;margin-top:2px">Hisoblaringizdagi qoldiq</div>'
        + '</div>';
  if(rows){
    h += '<div class="card" style="margin-top:10px">' + rows
       + '<div class="kv" style="border-top:1px solid var(--line);margin-top:2px">'
       + '<span><b>Sof boylik</b></span><b class="'+sgn(net)+'">'+fmtMoney(net,true)+'</b></div>';
    if(state.groups.length){
      h += '<div class="note" style="margin-top:8px">Guruh amaliyotlari naqd pulga ta‘sir qilmaydi. Ishchiga bergan pul kassadan ham ayrilishi uchun uni «Amaliyotlar» ga chiqim qilib yozing.</div>';
    }
    h += '</div>';
  }
  return h;
}
function combinedCard(ym){
  var R = repSel(ym), per = R.per, pref = R.p;
  var S = monthStock(pref);
  var C = cashOutside(pref);
  var G = groupMonthShares(pref);
  var hasG = state.groups.length > 0;
  if(!S.has && !hasG && !C.has) return '';
  var left = S.has ? stockTotal() : 0;

  /* qarzlar — butun davr uchun, sana bilan cheklanmaydi */
  var owedToMe=0, iOwe=0;
  state.groups.forEach(function(g){ var n=meNetForGroup(g); if(n>0) owedToMe+=n; else iOwe+=-n; });
  var gDebt = owedToMe - iOwe;
  /* umumiy natija = SOTUV + ombordan tashqari sof + guruhning sof qarzi.
     Sotuv — aylanma (ichida tannarx ham bor), foyda emas; shuning uchun
     «Foyda (FIFO)» alohida qator bo‘lib turadi va izohda formula yozilgan. */
  var total = S.sale + C.net + gDebt;
  var sgn = function(v){ return v<0 ? 'neg' : v>0 ? 'pos' : ''; };

  var h = '<div class="card"><div class="card-h"><h2>Birlashgan hisobot</h2>'
        + '<span class="chips" style="padding:0;gap:5px">'
        + '<button class="chip" style="padding:4px 11px;font-size:12px" data-act="repper" data-p="month" aria-pressed="'+(per==='month')+'">Oy</button>'
        + '<button class="chip" style="padding:4px 11px;font-size:12px" data-act="repper" data-p="year" aria-pressed="'+(per==='year')+'">Yil</button>'
        + '<button class="chip" style="padding:4px 11px;font-size:12px" data-act="repper" data-p="range" aria-pressed="'+(per==='range')+'">Davr</button>'
        + '</span></div>'
        + '<div class="eyebrow" style="margin:2px 0 6px">'+esc(R.label)+'</div>';

  if(S.has){
    h += '<div class="eyebrow" style="margin:2px 0 4px">Ombor · '+esc(omborName())+'</div>'
       + '<div class="kv"><span>Sotuv</span><b class="pos">'+fmtMoney(S.sale)+'</b></div>'
       + '<div class="kv"><span>Sotilganning tannarxi</span><b>'+fmtMoney(S.cogs)+'</b></div>'
       + '<div class="kv"><span>Foyda (FIFO)</span><b class="'+sgn(S.profit)+'">'+fmtMoney(S.profit,true)+'</b></div>'
       + '<div class="kv"><span>Hozir ombordagi tovar</span><b>'+fmtMoney(left)+'</b></div>';
  }

  if(C.has){
    h += '<div class="eyebrow" style="margin:12px 0 4px">Ombordan tashqari</div>'
       + '<div class="kv"><span>Tushum</span><b class="pos">'+fmtMoney(C.inc)+'</b></div>'
       + '<div class="kv"><span>Xarajat</span><b class="neg">'+fmtMoney(C.exp)+'</b></div>'
       + '<div class="kv"><span>Sof</span><b class="'+sgn(C.net)+'">'+fmtMoney(C.net,true)+'</b></div>';
  }

  if(hasG){
    h += '<div class="eyebrow" style="margin:12px 0 4px">Guruh</div>'
       + '<div class="kv"><span>Tushum (ulushingiz)</span><b class="pos">'+fmtMoney(G.inc)+'</b></div>'
       + '<div class="kv"><span>Xarajat (ulushingiz)</span><b class="neg">'+fmtMoney(G.exp)+'</b></div>'
       + '<div class="kv"><span>Menga qaytariladi</span><b class="pos">'+fmtMoney(owedToMe)+'</b></div>'
       + '<div class="kv"><span>Men qaytaraman</span><b class="neg">'+fmtMoney(iOwe)+'</b></div>'
       + '<div class="kv"><span>Guruh bo‘yicha sof</span><b class="'+sgn(gDebt)+'">'+fmtMoney(gDebt,true)+'</b></div>';
  }

  /* kamida ikkita manba bo‘lsa jami chiqadi — bittada u yuqoridagi
     qatorning takrori bo‘lib qolardi */
  if([S.has, C.has, hasG].filter(Boolean).length > 1){
    h += '<div class="kv" style="border-top:1px solid var(--line);margin-top:6px">'
       + '<span><b>Umumiy natija</b></span>'
       + '<b class="'+sgn(total)+'">'+fmtMoney(total,true)+'</b></div>';
  }
  h += '<div class="note" style="margin-top:8px">Umumiy natija = sotuv + ombordan tashqari sof + guruh bo‘yicha sof. Sotuv — aylanma, ichida tovarning tannarxi ham bor; sof foydani «Foyda (FIFO)» qatoridan ko‘ring. Faqat «Hozir ombordagi tovar» jamiga qo‘shilmaydi — u pul emas, tovar.</div>';
  h += '<div style="height:8px"></div>'
     + '<div class="chips" style="padding:0;gap:6px">'
     + '<button class="chip" style="padding:5px 12px;font-size:12px" data-act="nav" data-screen="ombor">Ombor ›</button>'
     + (hasG ? '<button class="chip" style="padding:5px 12px;font-size:12px" data-act="nav" data-screen="groups">Guruhlar ›</button>' : '')
     + '</div>';
  return h + '</div>';
}

function catMatch(sel, catId, catName){
  if(!sel) return true;
  if(catId===sel) return true;
  var c=cat(sel);
  return !!(c && catName && c.name===catName);
}
function catFilterOptions(sel){
  var ex=state.categories.filter(function(c){return c.kind==='expense';});
  var inc=state.categories.filter(function(c){return c.kind==='income';});
  var opt=function(c){ return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>'; };
  return '<option value="">Barcha kategoriyalar</option>'
    +'<optgroup label="Chiqim">'+ex.map(opt).join('')+'</optgroup>'
    +'<optgroup label="Kirim">'+inc.map(opt).join('')+'</optgroup>';
}

// Shaxsiy amaliyotlar + barcha guruh amaliyotlari — yagona ro‘yxat
function activityList(){
  var out=[];
  state.transactions.forEach(function(t){
    var c=cat(t.categoryId)||{name:'—'};
    out.push({ kind:'tx', id:t.id, date:t.date, type:t.type, amount:t.amount,
      catId:t.categoryId, catName:c.name, title:(t.note||c.name),
      gid:null, gname:null, memberIds:[], mine:t.amount, receipt:null });
  });
  state.groups.forEach(function(g){
    (g.expenses||[]).forEach(function(e){
      var et=entryType(e);
      var mids=[e.paidBy].concat((e.splits||[]).map(function(s){return s.memberId;}));
      out.push({ kind:'entry', id:e.id, date:e.date, type:et, amount:e.amount,
        catId:e.categoryId||catIdByName(e.categoryName,et),
        catName:(e.categoryName||(cat(e.categoryId)||{}).name||'—'),
        title:entryTitle(e), gid:g.id, gname:g.name, payerName:memName(g,e.paidBy),
        memberIds:mids, mine:myShareIn(g,e), receipt:e.receipt||null });
    });
  });
  return out;
}
function actRow(r){
  var inc=r.type==='income';
  var col=colorFor(r.catId||r.catName||r.id);
  var av = r.receipt
    ? '<div class="avatar rcimg"><img src="'+r.receipt+'" alt=""></div>'
    : '<div class="avatar" style="background:'+col+'">'+esc(initials(r.kind==='entry'?r.title:r.catName))+'</div>';
  var sub = r.kind==='entry'
    ? (esc(r.gname)+' · '+esc(r.payerName)+(r.mine>0?' · ulush '+fmtMoney(r.mine):''))
    : esc(r.catName);
  var act = r.kind==='entry'
    ? 'data-act="open-grp-entry" data-gid="'+r.gid+'" data-id="'+r.id+'"'
    : 'data-act="edit-tx" data-id="'+r.id+'"';
  return '<div class="row tap" '+act+'>'+av
    +'<div class="main"><div class="t">'+esc(r.title)+'</div><div class="s">'+sub+'</div></div>'
    +'<div class="end"><div class="a '+(inc?'pos':'neg')+'">'+(inc?'+':'−')+fmtMoney(r.amount).replace('−','')+'</div><div class="s">'+fmtDateShort(r.date)+'</div></div>'
    +'</div>';
}

/* ---------- TRANSACTIONS ---------- */

  var gSel = (grpSel && grpSel!=='__p') ? grp(grpSel) : null;

  var h='<div class="topbar"><h1>Amaliyotlar</h1></div>';
  h+='<input class="search" id="txsearch" placeholder="Qidirish…" value="'+esc(route.q||'')+'">';
  h+='<div class="chips">'
    +'<button class="chip" data-act="filter" data-f="all" aria-pressed="'+(f==='all')+'">Hammasi</button>'
    +'<button class="chip" data-act="filter" data-f="income" aria-pressed="'+(f==='income')+'">Kirim</button>'
    +'<button class="chip" data-act="filter" data-f="expense" aria-pressed="'+(f==='expense')+'">Chiqim</button>'
    +'</div>';
  h+='<div class="filters">'
    +'<select id="txcat">'+catFilterOptions(catSel)+'</select>'
    +'<select id="txgrp">'
    +'<option value="">Hammasi (shaxsiy + guruh)</option>'
    +'<option value="__p"'+(grpSel==='__p'?' selected':'')+'>Faqat shaxsiy</option>'
    + state.groups.map(function(g){return '<option value="'+g.id+'"'+(g.id===grpSel?' selected':'')+'>'+esc(g.name)+'</option>';}).join('')
    +'</select>';
  if(gSel){
    h+='<select id="txmem"><option value="">Barcha a‘zolar</option>'
      + gSel.members.map(function(m){return '<option value="'+m.id+'"'+(m.id===memSel?' selected':'')+'>'+esc(m.name)+'</option>';}).join('')
      +'</select>';
  }
  h+='</div>';

  var list=activityList().filter(function(r){
    if(f!=='all' && r.type!==f) return false;
    if(grpSel==='__p' && r.kind!=='tx') return false;
    if(gSel && r.gid!==gSel.id) return false;
    if(!catMatch(catSel, r.catId, r.catName)) return false;
    if(memSel && gSel && r.memberIds.indexOf(memSel)<0) return false;
    if(q && (r.title+' '+r.catName+' '+(r.gname||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});

  if(!list.length){ h+='<div class="empty">Amaliyot topilmadi</div>'; return h; }

  var ctype = (f==='income') ? 'income' : 'expense';
  var cch = catChart(list, ctype);
  if(cch) h+='<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>'
    + (ctype==='income'?'Kirim':'Chiqim') + ' — kategoriyalar</h2></div>' + cch + '</div>';
  var curDay=null;
  h+='<div>';
  list.forEach(function(r){
    if(r.date!==curDay){ curDay=r.date; h+='<div class="date-head">'+dayHead(r.date)+'</div>'; }
    h+=actRow(r);
  });
  h+='</div>';
  return h;
}

    +'<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'

/* Telefon klaviaturasida + va × tugmalari yo‘q — shuning uchun maydon
   ostida o‘z amal tugmalarimiz turadi. */
var CALC_KEYS = [['+','+'], ['−','-'], ['×','×'], ['÷','÷'], ['(','('], [')',')']];
function calcInsert(inp, ch){
  var v=inp.value, a=inp.selectionStart, b=inp.selectionEnd, pos;
  if(a==null || b==null){ inp.value = v + ch; pos = inp.value.length; }
  else { inp.value = v.slice(0,a) + ch + v.slice(b); pos = a + ch.length; }
  try{ inp.focus(); inp.setSelectionRange(pos,pos); }catch(e){}
  inp.dispatchEvent(new Event('input', {bubbles:true}));
}
/* Hamma raqam maydonini kalkulyatorga aylantiradi: amal tugmalari, yozayotganda
   natija, maydondan chiqqanda esa o‘rniga shu son yoziladi. */
function wireCalc(root){
  var qty = function(inp){ return (inp.getAttribute('inputmode')==='decimal'); };
  [].slice.call(root.querySelectorAll('input[inputmode="numeric"],input[inputmode="decimal"]')).forEach(function(inp){
    if(inp.closest && inp.closest('.split-line')) return;

    var line=document.createElement('div');
    line.className='calcline'; line.hidden=true;

    var pad=document.createElement('div');
    pad.className='calcpad'; pad.hidden=true;
    CALC_KEYS.forEach(function(k){
      var btn=document.createElement('button');
      btn.type='button'; btn.className='ckey'; btn.textContent=k[0];
      btn.setAttribute('aria-label', k[0]);
      var last=0;
      var fire=function(ev){
        if(ev.type==='click' && (Date.now()-last)<500) return;   /* pointerdown allaqachon ishladi */
        if(ev.type==='pointerdown'){ last=Date.now(); ev.preventDefault(); }  /* fokus maydonda qolsin */
        calcInsert(inp, k[1]);
      };
      btn.addEventListener('pointerdown', fire);
      btn.addEventListener('click', fire);
      pad.appendChild(btn);
    });

    if(inp.parentNode){
      inp.parentNode.insertBefore(line, inp.nextSibling);
      inp.parentNode.insertBefore(pad, line.nextSibling);
    }

    var paint=function(){
      var c=calcOf(inp.value);
      if(c===null){ line.hidden=true; return; }
      line.textContent='= ' + (qty(inp) ? fmtQty(Math.round(c*1000)/1000) : fmtMoney(Math.round(c)));
      line.hidden=false;
    };
    inp.addEventListener('input', paint);
    inp.addEventListener('focus', function(){ pad.hidden=false; });
    inp.addEventListener('blur', function(){
      setTimeout(function(){ if(document.activeElement!==inp) pad.hidden=true; }, 150);
      var c=calcOf(inp.value);
      if(c===null) return;
      inp.value = String(qty(inp) ? Math.round(c*1000)/1000 : Math.round(c));
      line.hidden=true;
      inp.dispatchEvent(new Event('input', {bubbles:true}));   /* bog‘liq hisoblar yangilansin */
    });
    paint();
  });
}

function openTxModal(existing, presetDate){
  var t=existing||{type:'expense',date:presetDate||today(),accountId:firstAccountId(),categoryId:fallbackCat('expense'),amount:'',note:''};
  var isEdit=!!existing;
  var body='<form>'
    +'<div class="seg" id="tseg">'
    +'<button type="button" data-t="expense" aria-pressed="'+(t.type==='expense')+'">Chiqim</button>'
    +'<button type="button" data-t="income" aria-pressed="'+(t.type==='income')+'">Kirim</button>'
    +'</div>'
    +'<div class="field"><label>Summa</label><input name="amount" inputmode="numeric" placeholder="0" value="'+(t.amount||'')+'" autofocus></div>'
    +'<div class="field"><label>Kategoriya</label><select name="categoryId" id="tcat">'+catOptions(t.categoryId,t.type)+'</select></div>'
    +'<div class="two">'
    +'<div class="field"><label>Hisob</label><select name="accountId">'+accOptions(t.accountId)+'</select></div>'
    +'<div class="field"><label>Sana</label><input type="date" name="date" value="'+t.date+'"></div>'
    +'</div>'
    +'<div class="field"><label>Izoh</label><input name="note" value="'+esc(t.note||'')+'" placeholder="ixtiyoriy"></div>'
    +'<button class="btn btn-primary btn-block" type="submit">'+(isEdit?'Saqlash':'Qo‘shish')+'</button>'
    +(isEdit?'<button class="btn btn-danger btn-block" type="button" data-act="del-tx" data-id="'+t.id+'">O‘chirish</button>':'')
    +'</form>';
  openModal(isEdit?'Amaliyotni tahrirlash':'Yangi amaliyot', body, {
    onMount:function(root){
      var type=t.type;
      root.querySelectorAll('#tseg button').forEach(function(b){
        b.addEventListener('click', function(){
          type=b.dataset.t;
          root.querySelectorAll('#tseg button').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.t===type); });
          document.getElementById('tcat').innerHTML=catOptions(null,type);
        });
      });
      root.querySelector('form').addEventListener('submit', function(){}, false);
      root._getType=function(){ return type; };
    },
    onSubmit:function(form){
      var type=modalEl._getType();
      var amt=parseAmount(form.amount.value);
      if(amt<=0){ form.amount.focus(); return; }
      var data={
        amount:amt, type:type,
        categoryId:form.categoryId.value,
        accountId:form.accountId.value,
        date:form.date.value||today(),
        note:form.note.value.trim()
      };
      if(isEdit){ Object.assign(t,data); }
      else{ state.transactions.push(Object.assign({id:uid()},data)); }
      clearSample(); closeModal(); commit();
    }
  });
}

function prevSplitMap(splits){
  var m={}; (splits||[]).forEach(function(s){ m[s.memberId]=s.share; }); return m;
}
function splitsLookEqual(splits){
  if(!splits || splits.length<2) return true;
  var sh=splits.map(function(s){return s.share;});
  return (Math.max.apply(null,sh) - Math.min.apply(null,sh)) <= 1;
}
function buildSplitBody(mode, g, amount, prev){
  prev = prev || {};
  var hasPrev = Object.keys(prev).length>0;
  var ids = g.members.map(function(m){return m.id;});
  var rows='';
  if(mode==='equal'){
    var eqIds = hasPrev ? ids.filter(function(id){return prev[id]!=null;}) : ids.slice();
    if(!eqIds.length) eqIds=ids.slice();
    var eq=splitEqual(amount, eqIds), map={}; eq.forEach(function(s){ map[s.memberId]=s.share; });
    g.members.forEach(function(m){
      var on = eqIds.indexOf(m.id)>=0;
      /* <label> ichidagi <input> cheksiz belgilamaydi — interaktiv
         element bo‘lgani uchun bosish belgilash tugmasiga o‘tmaydi */
      rows+='<label class="split-line"><input type="checkbox" class="pcheck" data-id="'+m.id+'"'+(on?' checked':'')+'>'
        +'<span class="nm">'+esc(m.name)+'</span>'
        +'<input class="xinput" data-id="'+m.id+'" inputmode="numeric" placeholder="+ shaxsiy">'
        +'<span class="calc" data-id="'+m.id+'">'+fmtMoney(map[m.id]||0)+'</span></label>';
    });
  }else if(mode==='exact'){
    g.members.forEach(function(m){
      var val = (hasPrev && prev[m.id]!=null) ? prev[m.id] : '';
      rows+='<div class="split-line"><span class="nm">'+esc(m.name)+'</span>'
        +'<input class="sinput" data-id="'+m.id+'" inputmode="numeric" placeholder="avto" value="'+val+'">'
        +'<span class="calc" data-id="'+m.id+'"></span></div>';
    });
  }else if(mode==='pct'){
    g.members.forEach(function(m){
      /* tahrirlashda hozirgi summadan foizni tiklaymiz */
      var val='';
      if(hasPrev && prev[m.id]!=null && amount>0){
        val = String(Math.round(prev[m.id]/amount*1000)/10);
      }
      rows+='<div class="split-line"><span class="nm">'+esc(m.name)+'</span>'
        +'<input class="sinput" data-id="'+m.id+'" inputmode="decimal" placeholder="0" value="'+val+'">'
        +'<span class="pcs">%</span>'
        +'<span class="calc" data-id="'+m.id+'"></span></div>';
    });
  }else{ // shares
    g.members.forEach(function(m){
      rows+='<div class="split-line"><span class="nm">'+esc(m.name)+'</span>'
        +'<input class="sinput" data-id="'+m.id+'" inputmode="numeric" value="1">'
        +'<span class="calc" data-id="'+m.id+'"></span></div>';
    });
  }
  return '<div class="split-list">'+rows+'</div><div class="split-status" id="sstat"></div>';
}

/* ---------- bitta a‘zoning amaliyotlari ---------- */
function openMemberView(gid, mid){
  var g=grp(gid); if(!g) return;
  var m=(g.members||[]).filter(function(x){ return x.id===mid; })[0];
  if(!m) return;

  var rows=(g.expenses||[]).map(function(e){
    var share=((e.splits||[]).filter(function(x){ return x.memberId===mid; })[0]||{}).share || 0;
    var paid = (e.paidBy===mid) ? e.amount : 0;
    return {e:e, share:share, paid:paid};
  }).filter(function(r){ return r.share>0 || r.paid>0; })
    .sort(function(a,b){ return a.e.date<b.e.date ? 1 : a.e.date>b.e.date ? -1 : 0; });

  var paidSum=0, shareSum=0, incPaid=0, incShare=0;
  rows.forEach(function(r){
    if(entryType(r.e)==='income'){ incPaid+=r.paid; incShare+=r.share; }
    else { paidSum+=r.paid; shareSum+=r.share; }
  });
  var net=computeBalances(g)[mid]||0;

  var body='<div class="view-amt '+(net<-1?'neg':net>1?'pos':'')+'">'
    + (Math.abs(net)<1 ? 'Hisob teng' : fmtMoney(net,true)) + '</div>'
    + '<div class="view-meta">'
    + '<div class="kv"><span>'+(net>1?'Unga qaytariladi':net<-1?'U qaytaradi':'Holati')+'</span><b>'
    +   (Math.abs(net)<1?'teng':fmtMoney(Math.abs(net)))+'</b></div>'
    + '<div class="kv"><span>Qatnashgan amaliyoti</span><b>'+rows.length+'</b></div>'
    + (paidSum>0  ? '<div class="kv"><span>U to‘lagan (xarajat)</span><b>'+fmtMoney(paidSum)+'</b></div>' : '')
    + (shareSum>0 ? '<div class="kv"><span>Uning ulushi (xarajat)</span><b>'+fmtMoney(shareSum)+'</b></div>' : '')
    + (incPaid>0  ? '<div class="kv"><span>U qabul qilgan (tushum)</span><b class="pos">'+fmtMoney(incPaid)+'</b></div>' : '')
    + (incShare>0 ? '<div class="kv"><span>Uning ulushi (tushum)</span><b class="pos">'+fmtMoney(incShare)+'</b></div>' : '')
    + '</div>';

  if(!rows.length){
    body += '<div class="empty" style="padding:16px 0">Bu a‘zo hali hech qaysi amaliyotda qatnashmagan.</div>';
  }else{
    body += '<div class="view-split"><div class="eyebrow">Amaliyotlari</div><div class="list">';
    rows.forEach(function(r){
      var inc=entryType(r.e)==='income';
      var sub=[];
      if(r.paid>0)  sub.push((inc?'qabul qildi ':'to‘ladi ')+fmtMoney(r.paid));
      if(r.share>0) sub.push('ulushi '+fmtMoney(r.share));
      body += '<div class="row tap" data-act="entry-view" data-gid="'+g.id+'" data-id="'+r.e.id+'">'
        + '<div class="avatar" style="background:'+colorFor(r.e.categoryName||r.e.id)+'">'+esc(initials(entryTitle(r.e)))+'</div>'
        + '<div class="main"><div class="t">'+esc(entryTitle(r.e))+'</div>'
        + '<div class="s">'+fmtDateShort(r.e.date)+(sub.length?(' · '+esc(sub.join(' · '))):'')+'</div></div>'
        + '<div class="end"><div class="a '+(inc?'pos':'')+'">'+(inc?'+':'')+fmtMoney(r.e.amount)+'</div></div>'
        + '</div>';
    });
    body += '</div></div>';
  }
  openModal(m.name, body, {});
}
