[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.bin, *.json, *.ttf"
exclude_filter="build/*, tools/*, tests/*, tool/*, server/*"
export_path="build/ColorLand3D.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=0

[preset.0.options]

gradle_build/use_gradle_build=true
; Kutubxona siqilmaydi: APK kattaroq bo'ladi, lekin ba'zi qurilmalarda
; siqilgan kutubxonani ochishda muammo chiqadi. Hajmdan ishonchlilik
; muhimroq.
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
package/unique_name="com.mening.colorland3d"
package/name="Color Land"
package/signed=true
keystore/debug="/root/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
; Release imzosi: hozircha xuddi shu sinov kaliti bilan — Play uchun
; o'z kalitingiz kerak bo'ladi (RELEASE.md ga qarang).
keystore/release="/root/debug.keystore"
keystore/release_user="androiddebugkey"
keystore/release_password="android"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0.0"
screen/immersive_mode=true
; O'yinchi o'z rasmini yuklashi uchun: galereyadan o'qish ruxsati.
permissions/read_external_storage=true
permissions/read_media_images=true

