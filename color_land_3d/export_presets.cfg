encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=0

[preset.3.options]

application/bundle_identifier="com.mening.colorland3d"
; Apple Developer hisobidagi Team ID. Bo'sh bo'lsa eksport
; boshlanmaydi — bu yagona majburiy maydon.
application/app_store_team_id=""
application/short_version="1.0.0"
application/version="1.0.0"
application/min_ios_version="14.0"
; Mahalliy tarmoqda (do'stlar bilan) o'ynash uchun.
capabilities/access_wifi=true
; Rasm yuklash imkoni qo'shilganda Apple shu izohni talab qiladi.
privacy/photolibrary_usage_description="Avatar va hudud naqshi uchun o'zingiz tanlagan rasm ishlatiladi."
