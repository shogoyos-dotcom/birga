# Color Land 3D — Android Test APK Qurish Workflow
#
# Ushbu workflow Godot 4.5 headless eksport vositasi orqali rasmiy Android ARM64
# test APK paketini (ColorLand3D_test.apk) avtomatik quradi va GitHub Actions
# artifact sifatida yuklaydi.
#
# Telefoningizdan yuklab olish:
# GitHub -> Actions -> "Build Android Test APK" -> Oxirgi run -> Artifacts -> "ColorLand3D-Test-APK"
#
# Xavfsizlik:
# - Faqat standart test debug keystore ishlatiladi (maxfiy release parollari yo'q)
# - permissions: contents: read (faqat o'qish huquqi)
# - Ikkilik APK fayli git omboriga commit qilinmaydi (faqat artefaktda saqlanadi)

name: Build Android Test APK

'on':
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
    paths:
      - 'color_land_3d/**'
      - '.github/workflows/godot-android-test-apk.yml'

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5-stable"
  COLOR_LAND_TEST_MODE: "1"

jobs:
  build-apk:
    name: Build & Package Android ARM64 Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download & Install Godot 4.5-stable
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o ~/godot/godot.zip
          unzip -q ~/godot/godot.zip -d ~/godot/
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          rm -f ~/godot/godot.zip

      - name: Cache Godot export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download & Install Godot 4.5 Export Templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o ~/godot/templates.tpz
          unzip -q ~/godot/templates.tpz -d ~/godot/tmp_templates
          mv ~/godot/tmp_templates/templates/* ~/.local/share/godot/export_templates/4.5.stable/
          ln -sfn ~/.local/share/godot/export_templates/4.5.stable ~/.local/share/godot/export_templates/4.5-stable
          rm -rf ~/godot/tmp_templates ~/godot/templates.tpz

      - name: Configure Godot Editor Settings for Android Export
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.5.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_pass = "android"
          export/android/debug_keystore_user = "androiddebugkey"
          EOF
          cp ~/.config/godot/editor_settings-4.5.tres ~/.config/godot/editor_settings-4.tres

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> $GITHUB_PATH

      - name: Verify Godot & Templates
        run: |
          godot --version
          ls -la ~/.local/share/godot/export_templates/4.5.stable/

      - name: Import project resources
        run: |
          set -o pipefail
          godot --headless --path color_land_3d --import 2>&1 | tee import.log

      - name: Export Android Test APK
        run: |
          mkdir -p color_land_3d/build
          set -o pipefail
          godot --headless --path color_land_3d --export-debug "Android" build/ColorLand3D_test.apk 2>&1 | tee build_apk.log

      - name: Verify APK
        run: |
          if [ ! -f "color_land_3d/build/ColorLand3D_test.apk" ]; then
            echo "ERROR: ColorLand3D_test.apk was not generated!"
            exit 1
          fi
          ls -lh color_land_3d/build/ColorLand3D_test.apk

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorLand3D-Test-APK
          path: color_land_3d/build/ColorLand3D_test.apk
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            import.log
            build_apk.log
          if-no-files-found: warn
